 const t=M.t[i];if(t.done||M.sel===i)return;

}

function tbuild(n){
 const[a,b]=TR[n-1],seen={},pool=[];

 const W=sh(pool);let k=0,ci=0;const nx=()=>W[k++%W.length];
 const od=(w,f)=>sh([w,...sh(pool.filter(x=>x[0]!=w[0]&&x[2]!=w[2]&&x[1]!=w[1])).slice(0,3)]).map(f);
 const cz=sh(CZ.filter(c=>c[0]>=a&&c[0]<=b));
 return sh("cccchhhhhhmmmmmppppqqqqlllttyy".split("")).map(t=>{
  if(t=="c"){const c=cz[ci++%cz.length];return{q:"Điền từ vào chỗ trống:",cz:1,big:c[1],vi:1,a:c[2],o:sh([c[2],...c[3]])}}
  const w=nx();
  if(t=="h")return{q:"Nghĩa của từ này là gì?",big:w[0],sub:w[1],a:w[2],o:od(w,x=>x[2]),say:w[0]};

  if(t=="l")return{q:"Nghe và chọn nghĩa đúng:",big:IC("speaker"),a:w[2],o:od(w,x=>x[2]),say:w[0],auto:1};
  if(t=="t"){const ok=Math.random()<.5,o=ok?w:sh(pool.filter(x=>x[2]!=w[2]))[0];return{q:"Đúng hay Sai?",big:w[0]+" = "+o[2],vi:1,a:ok?"Đúng":"Sai",o:["Đúng","Sai"]}}

 });

async function tai(i){

 try{
  const sm=await claude.use("sample");
  if(!sm){el.textContent="Giải thích chi tiết chưa khả dụng ở đây. Bạn xem phần ghi nhớ bên trên nhé.";return}
  const r=await sm(p,{modelTier:"quick",onText:x=>{el.textContent=x.text}});
  T.ex[i]=r.text;el.textContent=r.text;
 }catch(e){el.textContent=e&&e.code=="rate_limited"?"Bạn bấm hơi nhanh, chờ một chút rồi thử lại nhé.":"Chưa tải được giải thích lúc này. Bạn xem phần ghi nhớ bên trên nhé."}
}

 try{
  const sm=await claude.use("sample");if(!sm)throw 0;

 }catch(e){bt.disabled=false;bt.textContent="Chưa tải được, bấm để thử lại"}
}

 if(GS.mvg||GS.now<GS.until)return;
 if(GS.ct&&GS.now-GS.ct<2.5)return;
 const pd=pondRect(),o=[["walk",3],["sit",2],["sleep",1.2],["roll",1],["eat",1.5],["play",1],["curious",1],["dance",.6],["interact",S.pet&&S.pet!="koi"?1.6:0],["pond",pd?1:0],["crawl",.8],["spin",.8],["tumble",.6],["plop",.6]].filter(a=>a[0]!=GS.last&&a[1]>0);
 let r=Math.random()*o.reduce((a,b)=>a+b[1],0),a=o[0][0];for(const x of o){r-=x[1];if(r<=0){a=x[0];break}}
 GS.last=a;

 else if(a=="crawl")gGo(rnd(20,340),rnd(160,212),null),GS.st="crawl";

 else if(a=="interact")gGo(GS.px-30,GS.py,()=>{gAct("happy",3);GS.pr=GS.now+2;fxSpawn("heart")});

function gMove(dt){
 if(GS.mvg){const dx=GS.tx-GS.x,dy=GS.ty-GS.y,d=Math.hypot(dx,dy);
  if(d<3){GS.mvg=0;GS.st="idle";const cb=GS.cb;GS.cb=null;if(cb)cb();else GS.until=GS.now+rnd(1,3)}
  else{const sp=(GS.st=="run"?60:GS.st=="crawl"?16:30)*dt,nx=GS.x+dx/d*sp,ny=GS.y+dy/d*sp;if(!blocked(nx,ny)){GS.x=nx;GS.y=ny}else if(!blocked(nx,GS.y))GS.x=nx;else if(!blocked(GS.x,ny))GS.y=ny;else{GS.mvg=0;GS.st="idle";GS.until=GS.now+1}
   if(Math.abs(dx)>1)GS.f=dx>0?1:-1}}
 const P=S.pet&&PB[S.pet];if(!P)return;
 if(S.pet=="koi"){GS.px=40;GS.py=206;GS.ps="float";return}
 const tx=GS.x-GS.f*34,ty=GS.y+4,dx=tx-GS.px,dy=ty-GS.py,d=Math.hypot(dx,dy);
 if(GS.st=="sleep"&&P.idle=="sleep"&&d<60){GS.ps="sleep";return}
 if(d>P.far||(GS.mvg&&d>16)){const s=Math.min(d,P.sp*dt*(GS.mvg?1.3:1));GS.px+=dx/d*s;GS.py+=dy/d*s;GS.pf=dx>0?1:-1;GS.ps=P.mv}
 else if(P.idle=="play"){GS.pa=(GS.pa||0)+dt*1.4;GS.px=GS.x+Math.cos(GS.pa)*36;GS.py=GS.y+4+Math.sin(GS.pa)*7;GS.pf=Math.sin(GS.pa)>0?-1:1;GS.ps=P.mv}
 else GS.ps=P.idle;
 if(GS.now<GS.pr)GS.ps="react";
}

 if(G.tab=="pet"){const o=PETS.filter(p=>S.pets[p.id]);return`<div class="cd"><h3>Bạn đồng hành</h3>`+(o.length?`<div class="mg2"><button class="tg3 ${S.pet?"":"on"}" onclick="pickP('')">Không chọn</button>${o.map(p=>`<button class="tg3 ${S.pet==p.id?"on":""}" onclick="pickP('${p.id}')">${p.zh} ${p.vi}</button>`).join("")}</div>`:`<p class="qh">Bạn chưa có thú nuôi nào.</p>`)+`<a class="sw" href="#pets">Bộ sưu tập thú nuôi</a></div>`}
 if(G.tab=="dec"){const o=IT.filter(i=>i.cat=="garden"&&S.inv[i.id]>0);return`<div class="cd"><div class="rw"><button class="pri" onclick="gEdit(1)">编辑 · Chỉnh sửa bố cục</button></div>`+(o.length?`<div class="grid2">${o.map(i=>`<div class="it"><div class="th">${thumb(i)}</div><b class="hz">${i.zh}</b><small>${i.vi}</small><button class="${S.place[i.id]?"sw on":"sw"}" onclick="gPl('${i.id}')">${S.place[i.id]?"Cất đi":"Đặt vào"}</button></div>`).join("")}</div>`:`<p class="qh cen">Chưa có đồ vườn. <a href="#shop" style="color:var(--red);font-weight:700">Đến cửa hàng</a></p>`)+`</div>`}
 const se=curSeason(),au=S.ssn.mode!="manual";
 return`<div class="cd"><h3>四季设置 · Bốn mùa</h3><div class="mg2"><button class="tg3 ${au?"on":""}" onclick="setSea('mode','auto')">自动 · Tự động</button><button class="tg3 ${au?"":"on"}" onclick="setSea('mode','manual')">手动 · Thủ công</button></div>`+(au?`<div class="mg2"><small>Bán cầu:</small>${[["auto","Theo múi giờ"],["N","Bắc"],["S","Nam"]].map(h=>`<button class="tg3 ${S.ssn.hemi==h[0]?"on":""}" onclick="setSea('hemi','${h[0]}')">${h[1]}</button>`).join("")}</div><small class="qh">Đang là: ${SE[se].zh} ${SE[se].vi} (${hemi()=="S"?"Nam":"Bắc"} bán cầu)</small>`:`<div class="mg2">${Object.keys(SE).map(k=>`<button class="tg3 ${S.ssn.man==k?"on":""}" onclick="setSea('man','${k}')">${SE[k].zh} ${SE[k].vi}</button>`).join("")}</div>`)+`<div class="mg2"><button class="tg3 ${motionOn()?"on":""}" onclick="S.motion=motionOn()?0:1;save();PG.garden()">Chuyển động: ${motionOn()?"Bật":"Giảm"}</button></div><small class="qh">Mùa chỉ đổi hình ảnh, không ảnh hưởng XP, lá trúc hay cây trúc.</small></div>`;
}

PG.garden=()=>{

 $("#app").innerHTML=`<h2 class="h2 hz">我的花园 <small style="font-size:14px;font-weight:500">Khu vườn của tôi · ${SE[curSeason()].zh}</small></h2><div class="mus cen" style="margin-bottom:8px">${musIn()}</div><div class="scene${motionOn()?"":" nomo"}${G.edit?" edit":""}" id="gsc">${gsvg(1)}<div class="fxl" id="fx"></div></div>`+(G.edit?"":`<div class="tabs2">${GT.map(t=>`<button class="${G.tab==t[0]?"on":""}" onclick="G.tab='${t[0]}';PG.garden()">${t[1]}</button>`).join("")}</div>`)+`<div id="gb">${gbody()}</div>`;

function pbuy(id){const r=petBuy(id),p=PETS.find(x=>x.id==id);if(!r.ok){toast(r.msg,1);sfx("bad");return}sfx("up");hw();modal(`<div class="th" style="margin:0 auto;width:110px;height:110px"><svg viewBox="0 0 60 60">${PTA(id)}</svg></div><h2 class="hz" style="margin:6px 0">新伙伴：${p.zh}</h2><p class="qh">${p.vi} đã về nhà với bạn. Hãy chọn bạn ấy làm bạn đồng hành trong khu vườn nhé.</p>`,1);PG.pets()}
PG.pets=()=>{$("#app").innerHTML=`<h2 class="h2 hz">我的宠物 <small style="font-size:14px;font-weight:500">Thú nuôi của tôi</small></h2><div class="bal">${IC("leaf")} <b>${S.leaf}</b> lá trúc · <b>${S.xp}</b> XP</div><div class="grid2">${PETS.map(p=>{const ow=S.pets[p.id],lk=S.xp<p.xp;return`<div class="it"><div class="th"><svg viewBox="0 0 60 60" style="${lk&&!ow?"filter:grayscale(1);opacity:.5":""}">${PTA(p.id)}</svg></div><b class="hz">${p.zh}</b><small>${p.vi}</small><small class="qh">${PDS[p.id]}</small>`+(ow?`<button class="${S.pet==p.id?"sw on":"sw"}" onclick="pickP2('${p.id}')">${S.pet==p.id?"Đang đồng hành":"Chọn đồng hành"}</button>`:lk?`<div class="pr no">${IC("lock")} Cần ${p.xp} XP</div><button class="sw" disabled>Chưa mở khóa</button>`:`<div class="pr ${S.leaf<p.price?"no":""}">${IC("leaf")} ${p.price}</div><button class="pri" onclick="pbuy('${p.id}')">Mua</button>`)+`</div>`}).join("")}</div><p class="qh cen">Đạt đủ XP để mở khóa quyền mua, sau đó dùng lá trúc để mua. Thú nuôi không bao giờ bệnh hay biến mất.</p>`};
function pickP2(id){petPick(id);toast("Đã chọn bạn đồng hành");PG.pets()}
PG.comm=()=>{
 const code=shareCode();
 $("#app").innerHTML=`<h2 class="h2 hz">学习社区 <small style="font-size:14px;font-weight:500">Cộng đồng học tập</small></h2><div class="cd"><h3>Chia sẻ khu vườn của bạn</h3><p class="qh">Trang này lưu dữ liệu trên từng thiết bị nên chưa có bảng xếp hạng chung. Bạn có thể tạo <b>mã chia sẻ</b> để bạn bè tham quan khu vườn (chỉ xem, không sửa được). Mã chỉ chứa tên hiển thị, cấp gấu trúc, trang phục, thú nuôi, cây trúc, mùa và vị trí đồ vật. Không có thông tin cá nhân hay kết quả bài tập.</p><input class="inp sm" id="pn2" maxlength="24" placeholder="Tên hiển thị (không bắt buộc)" value="${S.prof.name||""}" onchange="S.prof.name=this.value.replace(/[<>&&quot;]/g,'').trim();save();PG.comm()"><textarea class="inp sm" id="cd1" rows="3" readonly onclick="this.select()">${code}</textarea><div class="rw"><button class="pri" onclick="cpy()">Sao chép mã</button></div></div><div class="cd" style="margin-top:14px"><h3>Tham quan khu vườn của bạn bè</h3><textarea class="inp sm" id="cd2" rows="3" placeholder="Dán mã chia sẻ vào đây"></textarea><div class="rw"><button class="pri" onclick="visit()">Tham quan</button></div><div id="vs"></div></div><div class="rw"><a class="sw" href="#honor">熊猫荣誉墙 · Bảng vinh danh</a></div>`};
function cpy(){const e=$("#cd1");e.select();try{navigator.clipboard.writeText(e.value).then(()=>toast("Đã sao chép mã")).catch(()=>document.execCommand("copy"))}catch(x){try{document.execCommand("copy");toast("Đã sao chép mã")}catch(y){}}}
function visit(){
 const V=readCode($("#cd2").value);if(!V){toast("Mã không hợp lệ",1);return}
 const tmp=G.edit;G.edit=0;
 $("#vs").innerHTML=`<div class="scene" style="margin-top:12px">${gsvg(0,{se:V.se,items:V.items,eq:V.eq,lvl:V.lvl,st:V.st,pet:V.pet})}</div><div class="box"><b>${V.name}</b> · ${PN[V.lvl-1][0]} ${V.stars?"· "+V.stars+" sao":""} · ${V.ach} thành tựu</div><div class="mg2">${["你的花园真漂亮！","你的熊猫好可爱！","你的竹子长得真好！"].map(t=>`<button class="tg3" onclick="navigator.clipboard&&navigator.clipboard.writeText('${t}');toast('Đã chép lời khen, hãy gửi cho bạn bè nhé')">${t}</button>`).join("")}</div><small class="qh">Bạn chỉ xem được khu vườn, không thể thay đổi hay mua đồ trong đó.</small>`;G.edit=tmp;
}
PG.honor=()=>{$("#app").innerHTML=`<h2 class="h2 hz">熊猫荣誉墙 <small style="font-size:14px;font-weight:500">Bảng vinh danh</small></h2><div class="grid2">${honors().map(h=>`<div class="it bd2 ${h[3]?"":"lk"}">${IC(h[3]?"award":"lock")}<b class="hz">${h[0]}</b><small>${h[1]}</small><small class="qh">${h[2]}</small></div>`).join("")}</div>`};
const shown=i=>!i.sea||i.sea==curSeason()||S.inv[i.id];
const RAR=[[40,"普通","Thường"],[100,"稀有","Hiếm"],[250,"珍贵","Quý hiếm"],[1e9,"传说","Huyền thoại"]];
PG.shop=()=>{
 const cs=[["food","Thức ăn"],["outfit","Trang phục"],["acc","Phụ kiện"],["room","Phòng"],["garden","Vườn"],["color","Màu lông"]];
 $("#app").innerHTML=`<h2 class="h2 hz">竹叶商店 <small style="font-size:14px;font-weight:500">Cửa hàng</small></h2><div class="bal">${IC("leaf")} <b>${S.leaf}</b> lá trúc · <b>${S.xp}</b> XP</div><div class="mus cen" style="margin-bottom:8px">${musIn()}</div><div class="tabs2">${cs.map(c=>`<button class="${SH.c==c[0]?"on":""}" onclick="SH.c='${c[0]}';PG.shop()">${c[1]}</button>`).join("")}</div><div class="grid2">${IT.filter(i=>i.cat==SH.c&&shown(i)).map(i=>{const ow=i.cat!="food"&&S.inv[i.id],lk=S.xp<(i.xp||0),r=RAR.find(x=>i.price<=x[0]);return`<div class="it"><div class="th">${thumb(i)}</div><b class="hz">${i.zh}</b><small>${i.vi}${i.cat=="food"?" · có "+(S.inv[i.id]||0):""}</small><small class="rar r${RAR.indexOf(r)}">${r[1]} ${r[2]}${i.sea?" · "+SE[i.sea].vi:""}</small>`+(ow?`<button class="sw" disabled>Đã sở hữu</button>`:lk?`<div class="pr no">${IC("lock")} Cần ${i.xp} XP</div><button class="sw" disabled>Chưa mở khóa</button>`:`<div class="pr ${S.leaf<i.price?"no":""}">${IC("leaf")} ${i.price}</div><button class="pri" onclick="bye('${i.id}')">Mua</button>`)+`</div>`}).join("")}</div><p class="qh cen">Vật phẩm theo mùa chỉ bán trong mùa tương ứng. Kiếm lá trúc bằng cách hoàn thành bài tập, ôn tập và nhiệm vụ mỗi ngày.</p>`;
};

<script>
/*ENGINE3*/
const COLS=[{id:"classic",zh:"经典",vi:"Cổ điển",dk:"#2b2b2b",lt:"#ffffff",bl:"#ff9aa8",price:0},{id:"choco",zh:"巧克力",vi:"Sô-cô-la",dk:"#6b4226",lt:"#f5ead8",bl:"#e8a27c",price:0},{id:"smoke",zh:"烟灰",vi:"Xám khói",dk:"#5a6470",lt:"#f4f6f8",bl:"#f0a8b4",price:0},{id:"pink",zh:"粉桃",vi:"Hồng đào",dk:"#d9527a",lt:"#fff0f4",bl:"#ffb3c6",price:40},{id:"sky",zh:"天蓝",vi:"Xanh biển",dk:"#2f6fb5",lt:"#eaf4ff",bl:"#ffb3c6",price:40},{id:"mint",zh:"薄荷",vi:"Xanh bạc hà",dk:"#2f9e86",lt:"#eafaf5",bl:"#ffc2c2",price:40},{id:"gold",zh:"金色",vi:"Vàng nắng",dk:"#c98a00",lt:"#fff7d6",bl:"#ffb38a",price:60,xp:300},{id:"violet",zh:"紫罗兰",vi:"Tím mộng mơ",dk:"#7a4ad0",lt:"#f3ecff",bl:"#ffb3d9",price:60,xp:300}];
const CM={};COLS.forEach(c=>CM[c.id]=c);
COLS.filter(c=>c.price>0).forEach(c=>{const o={id:"col_"+c.id,cat:"color",zh:c.zh,vi:c.vi,price:c.price,xp:c.xp||0};IT.push(o);IM[o.id]=o});
{const o={id:"col_custom",cat:"color",zh:"自选色",vi:"Bảng màu tự chọn",price:150,xp:300};IT.push(o);IM[o.id]=o}
const hex=v=>/^#[0-9a-f]{6}$/i.test(v)?v:null;
let PCO=null;
function PCOL(){if(PCO)return PCO;const c=S.col||{};if(c.pre=="custom"&&S.inv.col_custom)return{dk:hex(c.dk)||"#2b2b2b",lt:hex(c.lt)||"#ffffff",bl:hex(c.bl)||"#ff9aa8"};const p=CM[c.pre];if(p&&(p.price==0||S.inv["col_"+p.id]))return p;return COLS[0]}
function colSet(pre,x){if(pre=="custom"){if(!S.inv.col_custom)return 0;x=x||{};S.col={pre:"custom",dk:hex(x.dk)||"#2b2b2b",lt:hex(x.lt)||"#ffffff",bl:hex(x.bl)||"#ff9aa8"}}else{const p=CM[pre];if(!p||!(p.price==0||S.inv["col_"+pre]))return 0;S.col={pre}}save();return 1}
/*ENDENGINE3*/
function colThumb(x){const c=x.dk?x:CM[String(x.id).slice(4)]||{dk:"#7a4ad0",lt:"#ffe9f1",bl:"#ffb3d9"};PCO={dk:c.dk,lt:c.lt,bl:c.bl};const s=PD(S.lvl,{},"","","20 10 160 180");PCO=null;return s}
Object.assign(IP,{});
HT.splice(0,HT.length,["feed","Cho ăn"],["play","Chơi"],["bath","Tắm"],["wear","Thay đồ"],["color","Màu sắc"],["room","Phòng"],["garden","Vườn"]);
const WD={t:0,root:null,p:null,calm:0,hold:0,x:0,f:1,last:""};
function wdStop(){clearTimeout(WD.t);WD.root=null}
function wdHold(ms){WD.hold=Date.now()+ms}
function wdStart(sel,calm){
 wdStop();const root=$(sel);if(!root||!motionOn())return;const p=root.querySelector(".wp");if(!p)return;
 WD.root=root;WD.p=p;WD.calm=calm;WD.last="";WD.hold=0;WD.x=Math.max(0,(root.clientWidth-p.clientWidth)*.4);
 p.style.transitionDuration="0s";p.style.left=WD.x+"px";WD.t=setTimeout(wdStep,1200);
}
function wdStep(){
 const r=WD.root;if(!r||!document.body.contains(r)){wdStop();return}
 if(document.hidden||Date.now()<WD.hold){WD.t=setTimeout(wdStep,700);return}
 const p=WD.p,pd=p.querySelector("svg.pd"),W=Math.max(0,r.clientWidth-p.clientWidth);if(!pd){wdStop();return}
 const A=WD.calm?[["walk",2],["sit",3],["curious",2],["happy",1],["wave",1]]:[["walk",3],["run",1],["sit",1.5],["sleep",1.2],["roll",1],["spin",1],["tumble",.8],["jump",1.2],["dance",1],["eat",1.2],["curious",1],["crawl",.8],["plop",.8],["wave",1]];
 const o=A.filter(a=>a[0]!=WD.last);let q=Math.random()*o.reduce((s,a)=>s+a[1],0),a=o[0][0];for(const x of o){q-=x[1];if(q<=0){a=x[0];break}}
 WD.last=a;
 const done=ms=>{WD.t=setTimeout(()=>{const d=p.querySelector("svg.pd");if(d)d.setAttribute("class","pd idle");p.classList.remove("zzon","eaton");WD.t=setTimeout(wdStep,rnd(.5,1.6)*1000)},ms)};
 if(a=="walk"||a=="run"||a=="crawl"){const tx=Math.random()*W,d=Math.abs(tx-WD.x),dur=Math.max(.8,d/(a=="run"?110:a=="crawl"?22:45));p.style.setProperty("--f",tx>=WD.x?1:-1);pd.setAttribute("class","pd "+a);p.style.transitionDuration=dur+"s";p.style.left=tx+"px";WD.x=tx;done(dur*1000);return}
 pd.setAttribute("class","pd "+a);if(a=="sleep")p.classList.add("zzon");if(a=="eat")p.classList.add("eaton");
 done(({sit:4000,sleep:6500,roll:1200,spin:1300,tumble:1100,jump:1900,dance:3000,eat:4200,curious:2600,plop:1000,wave:2600,happy:1500})[a]||2500);
}
function refreshPanda(){const pd=$("#pdh");if(!pd)return;const h=document.createElement("div");h.innerHTML=PD(S.lvl,S.eq,"idle",'id="pdh"');const n=h.firstChild;n.setAttribute("class",pd.getAttribute("class"));pd.replaceWith(n)}
const _render=render;render=function(){wdStop();gStop();_render()};
const _home=home;home=function(){_home();wdStart("#stg",0)};
const _act=act;act=function(k,id){wdHold(2400);_act(k,id)};
const _hb=hbody;hbody=function(){return H.t=="color"?colorBody():_hb()};
function pickCol(id){if(colSet(id)){sfx("ok");toast("Đã đổi màu lông");PG.panda()}}
function custCol(){const v=i=>$("#"+i).value;colSet("custom",{dk:v("cdk"),lt:v("clt"),bl:v("cbl")});refreshPanda()}
function colorBody(){
 const own=COLS.filter(c=>c.price==0||S.inv["col_"+c.id]),n=COLS.length-own.length,cur=PCOL(),cu=S.col&&S.col.pre=="custom"?cur:cur;
 return`<div class="grid2">${own.map(c=>`<div class="it"><div class="th">${colThumb(c)}</div><b class="hz">${c.zh}</b><small>${c.vi}</small><button class="${S.col.pre==c.id?"sw on":"sw"}" onclick="pickCol('${c.id}')">${S.col.pre==c.id?"Đang dùng":"Chọn màu"}</button></div>`).join("")}</div>`
 +(S.inv.col_custom?`<div class="cd" style="margin-top:12px"><h3 class="hz">自选色 <small>Màu tự chọn</small></h3><div class="mg2"><label class="cl2">Lông tối <input type="color" id="cdk" value="${cu.dk}" oninput="custCol()"></label><label class="cl2">Lông sáng <input type="color" id="clt" value="${cu.lt}" oninput="custCol()"></label><label class="cl2">Má hồng <input type="color" id="cbl" value="${cu.bl}" oninput="custCol()"></label></div></div>`:"")
 +`<p class="qh cen">${n?"Còn "+n+" màu khác":"Bạn đã có đủ màu có sẵn"}${S.inv.col_custom?"":" và bảng màu tự chọn"} trong <a href="#shop" onclick="SH.c='color'" style="color:var(--red);font-weight:700">cửa hàng</a>.</p>`;
}
function roomScene(){
 const pl=IT.filter(i=>i.cat=="room"&&S.place[i.id]).map(i=>{const p=POS[i.id];return`<g transform="translate(${p[0]} ${p[1]}) scale(${p[2]})">${ART[i.id]}</g>`}).join("");
 return`<div class="scene${motionOn()?"":" nomo"}" id="rsc"><svg viewBox="0 0 360 230" class="sc">${BG.room}${pl}</svg><div class="wp" id="wp"><div class="wf">${PD(S.lvl,S.eq,"idle",'id="pdh"')}${BM}</div><span class="zz">z Z</span></div><div class="fxl" id="fx"></div></div>`;
}
PG.panda=()=>{
 gStop();wdStop();const t=H.t;
 let h=`<h2 class="h2 hz">熊猫之家 <small style="font-size:14px;font-weight:500">Ngôi nhà gấu trúc</small></h2><div class="mus cen" style="margin-bottom:8px">${musIn()}</div><div class="tabs2">${HT.map(x=>`<button class="${t==x[0]?"on":""}" onclick="H.t='${x[0]}';PG.panda()">${x[1]}</button>`).join("")}</div>`;
 if(t=="garden")h+=`<div class="scene${motionOn()?"":" nomo"}${G.edit?" edit":""}" id="gsc">${gsvg(1)}<div class="fxl" id="fx"></div></div>`+(G.edit?"":`<div class="tabs2 sub">${GT.map(x=>`<button class="${G.tab==x[0]?"on":""}" onclick="G.tab='${x[0]}';PG.garden()">${x[1]}</button>`).join("")}</div>`)+`<div id="gb">${gbody()}</div>`;
 else h+=roomScene()+`<div id="hb">${hbody()}</div>`;
 $("#app").innerHTML=h;
 if(t=="garden")gStart();else wdStart("#rsc",t=="wear"||t=="color");
 bgmSync();
};
PG.garden=()=>{H.t="garden";PG.panda()};
function seedCard(){
 const st=bstage(S.bam.pts),n=BSN[st-1],nx=BST[st],pc=st>=5?100:Math.round((S.bam.pts-BST[st-1])/(nx-BST[st-1])*100),done=S.bam.last==today();
