B2[1]={t:"她请我们吃了北京烤鸭",vi:"Cô ấy mời chúng tôi ăn vịt quay Bắc Kinh",v:P("Bài khóa 1-3 (Làm quen và nhờ vả):不好意思,bù hǎoyìsi,Ngại quá/Xin lỗi;帮忙,bāngmáng,Giúp đỡ;已经,yǐjīng,Đã@Bài khóa 4 (Tại khách sạn):介绍,jièshào,Giới thiệu;有时,yǒushí,Có lúc;懂,dǒng,Hiểu;意思,yìsi,Ý nghĩa/Ý kiến@Danh từ riêng:北京烤鸭,Běijīng kǎoyā,Vịt quay Bắc Kinh"),
g:[["Câu kiêm ngữ (请 / 让 / 叫)","Vị ngữ gồm hai cụm động từ; tân ngữ của động từ thứ nhất đồng thời là chủ ngữ của động từ thứ hai. Thường dùng với các động từ 请, 让, 叫.","她<b>请我们</b>吃北京烤鸭。"],["Câu chữ 是……的","Nhấn mạnh thời gian, địa điểm hoặc cách thức của một sự việc đã xảy ra trong quá khứ.","我<b>是</b>昨天来<b>的</b>。"],["Trợ từ ngữ khí 吧 (2)","Đặt cuối câu nghi vấn để biểu thị sự suy đoán hoặc ước lượng; người nói đã có phán đoán và chờ xác nhận.","你是学生<b>吧</b>？"],["Ghi chú của Tiểu Ngữ: Học tập","Cụm “<b>多听、多说</b>” (nghe nhiều, nói nhiều) nhấn mạnh việc luyện phản xạ lặp đi lặp lại để học tốt ngoại ngữ."],["Nội dung mở rộng của Tiểu Ngữ","Chủ đề <b>北京烤鸭的吃法</b>: cách thưởng thức vịt quay Bắc Kinh đúng cách, giới thiệu đặc sản nổi tiếng của thủ đô cùng văn hóa ẩm thực và cách đãi khách của người Trung Quốc."]]};
B2[2]={t:"还是打车去北大吧",vi:"Hay là bắt taxi đi Đại học Bắc Kinh đi",v:P("Bài khóa 1 (Quầy lễ tân khách sạn):公交车,gōngjiāochē,Xe buýt;但,dàn,Nhưng;车站,chēzhàn,Bến xe/Trạm dừng;远,yuǎn,Xa;打车,dǎchē,Bắt taxi;还是,háishi,Hay là/Nên@Bài khóa 2 (Khuôn viên Đại học Bắc Kinh):啊,a,Trợ từ ngữ khí (tán thành/ngạc nhiên);万,wàn,Vạn/Mười nghìn;名,míng,Lượng từ chỉ người;网上,wǎngshang,Trên mạng;外国,wàiguó,Nước ngoài;间,jiān,Lượng từ cho phòng;教室,jiàoshì,Phòng học@Bài khóa 3 (Vé xem phim):票,piào,Vé;别,bié,Đừng/Không nên@Bài khóa 4 (Tin nhắn gửi Trần Thiên Trung):过来,guòlái,Lại đây/Qua đây@Danh từ riêng:北京大学,Běijīng Dàxué,Đại học Bắc Kinh (gọi tắt 北大 Běidà)"),
g:[["Cấu trúc cố định 还是……吧","Biểu thị sự lựa chọn mang tính ưu tiên sau khi đã cân nhắc các phương án; nghĩa là “hay là… đi”.","<b>还是</b>打车去北大<b>吧</b>。"],["Dùng 多 biểu thị số ước lượng","Đặt 多 sau số từ hoặc cụm số lượng để chỉ lượng lớn hơn số đó một chút.","两万<b>多</b>名学生"],["Định ngữ là cụm động từ hoặc cụm chủ–vị","Cụm động từ hoặc cụm chủ–vị đứng trước danh từ (thường kèm 的) để miêu tả đặc điểm, trạng thái của sự vật.","<b>我昨天买的</b>书"],["Ghi chú của Tiểu Ngữ: Từ vựng","<b>好</b> trong cụm “好打车” nghĩa là “dễ”; <b>天啊</b> là thán từ biểu thị sự kinh ngạc; <b>到</b> trong khẩu ngữ bài này nghĩa là “đạt đến” một mức độ nào đó."],["Nội dung mở rộng của Tiểu Ngữ","<b>中国著名学府——北京大学</b>: giới thiệu Đại học Bắc Kinh, một trong những ngôi trường danh giá và lâu đời nhất Trung Quốc, cùng quy mô và vẻ đẹp của khuôn viên trường."]]};
B2[3]={t:"我想去西安旅游",vi:"Tôi muốn đi du lịch Tây An",v:P("Bài khóa 1 (Tại cửa nhà):回来,huílái,Trở về;这么,zhème,Thế này/Vậy;完,wán,Xong/Hết@Bài khóa 2 (Phòng khách):一起,yìqǐ,Cùng nhau;出去,chūqù,Đi ra ngoài@Bài khóa 3 (Phòng khách):洗,xǐ,Rửa/Giặt;自己,zìjǐ,Tự mình;拿,ná,Cầm/Lấy;手,shǒu,Tay;为什么,wèishénme,Tại sao;不错,búcuò,Không tệ/Khá tốt@Bài khóa 4 (Vương Y Tuyết gọi điện cho bạn):送,sòng,Tặng/Đưa tiễn/Đưa đến;回去,huíqù,Trở về;每,měi,Mỗi;累,lèi,Mệt"),
g:[["Bổ ngữ kết quả","Một số động từ hoặc tính từ đặt sau động từ để chỉ kết quả của hành động.","做<b>完</b> (làm xong) · 做<b>好</b> (làm tốt/xong)"],["Động từ lặp lại (1)","Biểu thị hành động diễn ra trong thời gian ngắn, mang tính thử nghiệm hoặc tạo ngữ khí nhẹ nhàng.","想<b>一想</b> (suy nghĩ một chút) · 休息<b>休息</b> (nghỉ ngơi một lát)"],["Động từ lặp lại (2)","Khi diễn tả hành động đã xảy ra, động từ đơn âm tiết có dạng “A 了 A” hoặc “A 了一下”.","看<b>了</b>看 (đã xem qua)"],["Ghi chú của Tiểu Ngữ: Khẩu ngữ","<b>对了</b> (duìle) thường dùng khi người nói chợt nhớ ra một chuyện khác hoặc muốn chuyển sang chủ đề mới."],["Nội dung mở rộng của Tiểu Ngữ","<b>西安的旅游景点</b>: giới thiệu vẻ đẹp lịch sử của cố đô Tây An, tiêu biểu là Đội quân đất nung (Terracotta Army)."]]};
B2[4]={t:"你穿红色的很好看",vi:"Bạn mặc đồ màu đỏ rất đẹp",v:P("Khởi động:裤子,kùzi,Quần;书包,shūbāo,Cặp sách;过去,guòqù,Đi qua;颜色,yánsè,Màu sắc@Bài khóa 1 (Cửa trung tâm thương mại):过,guo,Trợ từ động thái (từng);商场,shāngchǎng,Trung tâm thương mại;进去,jìnqù,Đi vào;条,tiáo,Lượng từ cho quần/vật dài@Bài khóa 2 (Cửa hàng quần áo):白色,báisè,Màu trắng;因为,yīnwèi,Bởi vì;试,shì,Thử;红色,hóngsè,Màu đỏ;所以,suǒyǐ,Cho nên@Bài khóa 3 (Cửa hàng cặp sách):绿色,lǜsè,Màu xanh lá;黑色,hēisè,Màu đen;更,gèng,Hơn nữa/Càng"),
g:[["Trợ từ động thái 过","Đặt sau động từ, biểu thị hành động hoặc trải nghiệm đã từng xảy ra trong quá khứ nhưng không còn tiếp diễn ở hiện tại.","我去<b>过</b>商场。"],["Câu phức nhân quả 因为……，所以……","Nối hai phân câu biểu thị quan hệ nguyên nhân và kết quả.","<b>因为</b>红色很好看，<b>所以</b>我买了。"],["Cụm từ chữ 的","Danh từ, đại từ, tính từ hoặc động từ kết hợp với 的 tạo thành cụm có chức năng của danh từ, giúp câu gọn hơn.","红色<b>的</b> (cái màu đỏ)"],["Văn hóa màu sắc","Giới thiệu thói quen và quan niệm của người Trung Quốc về màu sắc trong trang phục và đời sống hằng ngày, đặc biệt là sự yêu thích màu đỏ."],["Kỹ năng mua sắm","Cách hỏi ý kiến về món đồ và cách đưa ra gợi ý khi mua sắm.","<b>怎么样</b>？ · 试试那条红色的<b>吧</b>。"]]};
B2[5]={t:"第一次去中国朋友家",vi:"Lần đầu đến nhà người bạn Trung Quốc",v:P("Bài khóa 1:出来,chūlái,Ra đây;等,děng,Đợi/Chờ;快,kuài,Nhanh/Sắp;起来,qǐlái,Thức dậy/Đứng dậy;上来,shànglái,Lên đây;上去,shàngqù,Lên đó;下来,xiàlái,Xuống đây;下去,xiàqù,Xuống đó@Bài khóa 2 (Đến thăm nhà Vương Y Tuyết):进来,jìnlái,Đi vào;爷爷,yéye,Ông nội;奶奶,nǎinai,Bà nội;礼物,lǐwù,Quà tặng;准备,zhǔnbèi,Chuẩn bị@Bài khóa 3 (Món ăn và đồ uống):奶茶,nǎichá,Trà sữa;跟,gēn,Cùng với/Và@Bài khóa 4 (Tin nhắn sau bữa ăn):走,zǒu,Đi/Rời đi;酒店,jiǔdiàn,Khách sạn"),
g:[["Bổ ngữ xu hướng đơn (1)","Cấu trúc <b>động từ + 来/去</b> chỉ hướng của hành động đối với người nói: 来 là tiến về phía người nói, 去 là rời xa người nói.","进<b>来</b> (vào đây) · 进<b>去</b> (vào kia)"],["Bổ ngữ xu hướng đơn (2)","Khi có tân ngữ chỉ nơi chốn, tân ngữ đặt giữa động từ và 来/去.","他进教室<b>去</b>了。"],["Cấu trúc cố định 都……了","Biểu thị sự việc đã xảy ra hoặc đạt đến một mức độ nhất định, thường nhấn mạnh hoặc thể hiện sự không hài lòng.","<b>都</b>12点<b>了</b>，我们吃饭吧。"],["Nội dung mở rộng của Tiểu Ngữ","Cách chào hỏi và nghi thức khi đến thăm nhà người Trung Quốc; ý nghĩa của việc tặng quà và cách đáp lại sự hiếu khách khi được mời dùng bữa."]]};
B2[6]={t:"小雪，生日快乐！",vi:"Tiểu Tuyết, sinh nhật vui vẻ!",v:P("Bài khóa 1-2:生日,shēngrì,Sinh nhật;快乐,kuàilè,Vui vẻ;蛋糕,dàngāo,Bánh kem;画,huà,Vẽ/Bức tranh;画笔,huàbǐ,Bút vẽ;打开,dǎkāi,Mở ra;漂亮,piàoliang,Đẹp@Bài khóa 3 (Tiệc sinh nhật):长,cháng,Dài;鱼,yú,Cá;肉,ròu,Thịt;过,guò,Đón/Trải qua;地,de,Trợ từ nối trạng ngữ và động từ@Bài khóa 4 (Nhật ký của Vương Y Tuyết):床,chuáng,Giường;舒服,shūfu,Thoải mái/Dễ chịu"),
g:[["Lặp lại tính từ","Dạng lặp AA hoặc AABB làm tăng mức độ miêu tả hoặc thể hiện sự yêu thích, trìu mến.","大大的 (to to) · 漂漂亮亮的 (xinh xinh)"],["Cụm từ cố định 什么的","Đặt cuối phần liệt kê để chỉ các sự vật cùng loại, tương đương “vân vân”.","鱼、肉、蛋糕<b>什么的</b>"],["Trợ từ kết cấu 地","Đặt sau tính từ để tạo thành trạng ngữ bổ nghĩa cho động từ, miêu tả cách thức thực hiện hành động.","高兴<b>地</b>玩 (chơi một cách vui vẻ)"],["Ghi chú của Tiểu Ngữ: Văn hóa","Người Trung Quốc ăn <b>长寿面</b> (mì trường thọ) trong ngày sinh nhật vì sợi mì dài tượng trưng cho sự sống lâu."],["Nội dung mở rộng của Tiểu Ngữ","Các món ăn đặc trưng ngày sinh nhật, cùng các loại bánh và thức ăn mang ý nghĩa may mắn trong dịp mừng tuổi mới."]]};
B2[7]={t:"他篮球打得很好",vi:"Anh ấy chơi bóng rổ rất giỏi",v:P("Bài khóa 1 (Trong lớp học):从,cóng,Từ (điểm bắt đầu);往,wǎng,Hướng về/Đi;跑,pǎo,Chạy/Đi;打,dǎ,Đánh/Chơi (môn dùng tay);篮球,lánqiú,Bóng rổ@Bài khóa 2 (Khuôn viên trường):运动,yùndòng,Vận động/Thể thao;踢,tī,Đá;足球,zúqiú,Bóng đá;球,qiú,Quả bóng;得,de,Trợ từ nối bổ ngữ trạng thái@Bài khóa 3 (Khuôn viên trường):跑步,pǎobù,Chạy bộ;游泳,yóuyǒng,Bơi lội;游,yóu,Bơi@Bài khóa 4 (Nhật ký của Trần Thiên Trung):爱好,àihào,Sở thích;开始,kāishǐ,Bắt đầu"),
g:[["Câu phức rút gọn 一……就……","Biểu thị hai hành động nối tiếp nhau (vừa… đã…) hoặc quan hệ điều kiện – kết quả (hễ… là…).","我<b>一</b>下课<b>就</b>去踢足球。"],["Bổ ngữ trạng thái (1)","Đứng sau động từ, nối bằng 得, để miêu tả hoặc đánh giá trạng thái, mức độ của hành động đã hoặc thường xuyên xảy ra.","他跑<b>得</b>很快。"],["Bổ ngữ trạng thái (2)","Khi động từ có tân ngữ đi kèm hoặc là từ ly hợp, lặp lại động từ rồi mới thêm 得 + bổ ngữ.","他<b>打篮球打得</b>很好。 · 他篮球<b>打得</b>很好。"],["Mục tiêu giao tiếp","Mô tả các hoạt động thể chất thường xuyên và đánh giá khả năng chơi thể thao của bản thân hoặc người khác. Bài tập trung vào luyện nói theo cặp và khảo sát nhóm về thói quen vận động."]]};
B2[8]={t:"虽然你忘了，但是我记得",vi:"Dù bạn quên rồi nhưng tôi vẫn nhớ",v:P("Bài khóa 1-2:比,bǐ,So với;左,zuǒ,Trái;左边,zuǒbiān,Bên trái;右,yòu,Phải;右边,yòubiān,Bên phải;虽然,suīrán,Mặc dù;但是,dànshì,Nhưng;记得,jìde,Nhớ;手表,shǒubiǎo,Đồng hồ đeo tay;点,diǎn,Giờ;爱情片,àiqíngpiàn,Phim tình cảm@Bài khóa 4 (Vương Y Tuyết và Lưu Minh):妻子,qīzi,Vợ;丈夫,zhàngfu,Chồng;饭馆,fànguǎn,Nhà hàng/Tiệm ăn"),
g:[["Câu so sánh (1) – giới từ 比","Cấu trúc A + 比 + B + tính từ. Không dùng phó từ mức độ như 很, 非常 trước tính từ trong câu so sánh này.","他<b>比</b>我高。"],["Câu so sánh (2)","Có thể dùng 更 hoặc 还 trước tính từ để nhấn mạnh mức độ hơn; vẫn không dùng 很.","今天<b>比</b>昨天<b>更</b>冷。"],["Câu phức nghịch chuyển 虽然……，但是……","Biểu thị quan hệ nhượng bộ: vế sau nêu kết quả trái ngược hoặc khác với dự đoán ở vế đầu.","<b>虽然</b>你忘了，<b>但是</b>我记得。"],["Ghi chú của Tiểu Ngữ: Từ vựng","<b>请</b> trong bài này nghĩa là <b>请客</b> (mời khách/bao đãi), ví dụ mời ăn cơm hoặc đi xem phim."],["Nội dung mở rộng của Tiểu Ngữ (彩蛋)","<b>中国人对数字的喜好</b>: ví dụ số <b>888</b> được ưa chuộng vì tượng trưng cho sự phát tài (phát – phát – phát)."]]};
B2[9]={t:"我去买杯奶茶",vi:"Tôi đi mua một ly trà sữa",v:P("Bài khóa 1 (Tại cửa hàng):坏,huài,Hỏng;旁边,pángbiān,Bên cạnh;男孩儿,nánháir,Bé trai;这样,zhèyàng,Như thế này;个子,gèzi,Vóc dáng/Chiều cao;那么,nàme,Như thế kia;高,gāo,Cao@Bài khóa 2 (Tại cửa hàng):门口,ménkǒu,Cổng/Lối vào;咖啡,kāfēi,Cà phê;离,lí,Cách@Bài khóa 3 (Tại quán cà phê):近,jìn,Gần;走路,zǒulù,Đi bộ@Bài khóa 4 (Nhật ký của Vương Y Tuyết):周,zhōu,Tuần"),
g:[["Câu so sánh (3) – 没有","Cấu trúc A + 没有 + B + (这么/那么) + tính từ: A không bằng B. 这么/那么 nhấn mạnh mức độ của đối tượng được so sánh.","我<b>没有</b>他<b>那么</b>高。"],["Động từ 离","Biểu thị khoảng cách về không gian hoặc thời gian giữa hai địa điểm hoặc hai mốc thời gian.","咖啡店<b>离</b>这儿很近。"],["Bổ ngữ thời lượng (1)","Đứng sau động từ để chỉ khoảng thời gian mà hành động hoặc trạng thái đó duy trì.","我在北京住<b>了一周</b>。"],["Ghi chú của Tiểu Ngữ: Từ vựng","<b>会</b> trong bài này biểu thị khả năng xảy ra của sự việc. Cấu trúc <b>động từ + 到</b> biểu thị hành động đã đạt được mục đích."],["Nội dung mở rộng của Tiểu Ngữ","<b>新中式茶饮</b>: xu hướng thưởng thức trà sữa và các loại đồ uống trà hiện đại của giới trẻ Trung Quốc."]]};
B2[10]={t:"就要考试了",vi:"Sắp thi rồi",v:P("Bài khóa 1:门,mén,Lượng từ cho môn học/Cánh cửa;题,tí,Đề bài/Câu hỏi;笑,xiào,Cười/Mỉm cười;错,cuò,Sai/Nhầm lẫn;考试,kǎoshì,Thi cử/Kỳ thi@Bài khóa 2 (Trong phòng học):词,cí,Từ;本子,běnzi,Vở;还是,háishi,Hay là/Hoặc"),
g:[["Câu vị ngữ cụm chủ–vị","Vị ngữ là một cụm chủ–vị, dùng để miêu tả hoặc giải thích rõ hơn cho chủ ngữ chính của câu.","她<b>个子很高</b>。"],["Câu hỏi lựa chọn","Dùng liên từ 还是 trong câu nghi vấn để đưa ra hai hoặc nhiều phương án cho người nghe lựa chọn.","你喝茶<b>还是</b>喝咖啡？"],["Cấu trúc cố định 要/快/快要/就要……了","Biểu thị một sự việc hoặc tình huống sắp xảy ra trong tương lai gần.","我们<b>就要</b>考试<b>了</b>。"],["Mục tiêu bài học","Nghe hiểu và dùng được câu vị ngữ cụm chủ–vị, câu hỏi lựa chọn và cấu trúc diễn tả sự việc sắp xảy ra. Bài còn ôn từ vựng, kiểm tra các câu làm sai và chuẩn bị tâm lý cho kỳ thi."]]};
B2[11]={t:"我最喜欢吃中国菜",vi:"Tôi thích ăn món Trung Quốc nhất",v:P("Bài khóa 1-2:着,zhe,Trợ từ động thái (tiếp diễn);经常,jīngcháng,Thường xuyên;路上,lùshang,Trên đường;慢,màn,Chậm;疼,téng,Đau/Nhức;头,tóu,Đầu;身体,shēntǐ,Cơ thể/Sức khỏe@Bài khóa 3 (Lý Văn đến thăm Bạch Gia Nguyệt):进,jìn,Vào;药,yào,Thuốc;时,shí,Lúc/Khi;最,zuì,Nhất@Bài khóa 4 (Nhật ký của Bạch Gia Nguyệt):药店,yàodiàn,Tiệm thuốc@Từ bổ sung (ôn lại):已经,yǐjīng,Đã;帮忙,bāngmáng,Giúp đỡ;不好意思,bù hǎoyìsi,Ngại quá/Xin lỗi"),
g:[["Trợ từ động thái 着 (1)","Đặt sau động từ để biểu thị sự tiếp diễn của hành động hoặc trạng thái đang tồn tại.","他在门口坐<b>着</b>。"],["Trợ từ động thái 着 (2)","Tân ngữ đứng sau 着: Chủ ngữ + động từ + 着 + tân ngữ. Phủ định dùng 没(有) + động từ + 着.","他穿<b>着</b>一件红衣服。"],["Phó từ mức độ 最","Đặt trước tính từ hoặc động từ tâm lý để chỉ mức độ cao nhất (vượt qua tất cả các đối tượng khác).","我<b>最</b>喜欢吃中国菜。"],["Ghi chú của Tiểu Ngữ: Y tế","<b>开</b> trong cụm <b>开药</b> nghĩa là viết (đơn thuốc)."],["Nội dung mở rộng của Tiểu Ngữ (彩蛋 11-1)","<b>中国喝水的习惯</b>: người Trung Quốc thích uống nước ấm/nóng vì tin rằng tốt cho sức khỏe và hệ tiêu hóa."]]};
B2[12]={t:"这里比北京冷多了",vi:"Ở đây lạnh hơn Bắc Kinh nhiều",v:P("Bài khóa 1:晴,qíng,Nắng/Quang đãng;楼,lóu,Tòa nhà/Tầng;地铁,dìtiě,Tàu điện ngầm@Bài khóa 2 (Vương Y Tuyết gọi cho Vương Nhất Phi):外面,wàimiàn,Bên ngoài;阴,yīn,U ám@Bài khóa 3-4:正,zhèng,Đang (hành động diễn ra);大晴天,dà qíngtiān,Ngày nắng ráo;多,duō,Nhiều (trong 冷多了);得多,de duō,Nhiều (trong 冷得多)@Từ bổ sung:经常,jīngcháng,Thường xuyên;路,lù,Đường/Tuyến xe"),
g:[["Câu so sánh (4)","Trong câu 比, có thể thêm <b>多了</b> hoặc <b>得多</b> sau tính từ để biểu thị mức độ chênh lệch rất lớn.","这里比北京冷<b>多了</b>。 · 今天比昨天冷<b>得多</b>。"],["Câu so sánh (5)","Kết hợp câu so sánh với bổ ngữ trạng thái để so sánh mức độ thực hiện hành động.","他跑<b>得比</b>我快。"],["Câu so sánh (6)","Khi động từ chính mang cả tân ngữ và bổ ngữ trạng thái, cần lặp lại động từ hoặc đưa tân ngữ lên trước.","他说中文<b>说得比</b>我好。"],["Ghi chú của Tiểu Ngữ: Từ vựng","<b>大晴天</b> (dà qíngtiān) miêu tả thời tiết cực kỳ trong lành, nắng đẹp và dễ chịu."],["Mục tiêu bài học","Thảo luận về thời tiết và dùng thành thạo các dạng câu so sánh để miêu tả sự khác biệt rõ rệt giữa các sự vật, hiện tượng."]]};
B2[13]={t:"我们爱上中文课",vi:"Chúng tôi yêu thích giờ học tiếng Trung",v:P("Bài khóa 1 (Trong lớp học):新年,xīnnián,Năm mới;教,jiāo,Dạy;花,huā,Hoa;希望,xīwàng,Hy vọng/Mong muốn@Bài khóa 2 (Trong lớp học):上面,shàngmiàn,Phía trên/Bề mặt;洗手间,xǐshǒujiān,Nhà vệ sinh;里面,lǐmiàn,Bên trong;笔,bǐ,Bút/Nét chữ@Bài khóa 3 (Trong lớp học):可能,kěnéng,Có thể/Có lẽ;上网,shàngwǎng,Lên mạng;那样,nàyàng,Như thế/Như vậy@Bài khóa 4 (Nhật ký của Bạch Gia Nguyệt):告诉,gàosu,Nói cho biết;班,bān,Lớp"),
g:[["Câu song tân ngữ (2)","Các động từ như 拿, 送, 卖 khi kết hợp với 给 cũng mang hai tân ngữ (người và vật).","他送<b>给</b>我一个蛋糕。 · 老师<b>教</b>我们中文。"],["Câu so sánh (7)","Đặt cụm số lượng sau tính từ để biểu thị sự chênh lệch cụ thể.","我比他大<b>三岁</b>。"],["Câu so sánh (8)","Dùng 一点儿 hoặc 一些 sau tính từ để biểu thị sự chênh lệch không lớn.","今天比昨天冷<b>一点儿</b>。"],["Ghi chú của Tiểu Ngữ: Đoán nghĩa từ ghép","Có thể đoán nghĩa từ ghép dựa trên các từ đã học: 咖啡 + 杯子 → <b>咖啡杯</b> (tách cà phê). Trong ngữ cảnh viết chữ Hán, 笔 còn dùng để chỉ các nét viết."]]};
B2[14]={t:"一个人过年多没意思啊",vi:"Một mình đón Tết thật chẳng có ý nghĩa gì",v:P("Bài khóa 1:包,bāo,Túi/Cặp/Bao kiện;女孩儿,nǚháir,Bé gái/Cô gái@Bài khóa 2 (Ở dưới lầu):过年,guònián,Đón Tết;没意思,méi yìsi,Vô vị/Không thú vị;位,wèi,Vị (lượng từ lịch sự chỉ người);前面,qiánmiàn,Phía trước@Bài khóa 3 (Tại nhà Vương Nhất Phi):房子,fángzi,Ngôi nhà;小孩儿,xiǎoháir,Đứa trẻ@Bài khóa 4 (Nhật ký):姓,xìng,Họ/Mang họ;眼睛,yǎnjing,Mắt;跳舞,tiàowǔ,Nhảy múa"),
g:[["Câu tồn tại (2)","Địa điểm + động từ + 着 + người/vật: miêu tả sự tồn tại của người hoặc vật tại một địa điểm.","前面坐<b>着</b>一位老师。"],["Phó từ mức độ 多","Dùng trong câu cảm thán để biểu thị mức độ cao của tính chất hoặc trạng thái.","一个人过年<b>多</b>没意思<b>啊</b>！"],["Bổ ngữ xu hướng phức","Động từ kết hợp các cặp như 上来/下去, 进来/出去, 回来/过去 để chỉ hướng vận động phức hợp.","他从前面跑<b>过来</b>了。"],["Ghi chú của Tiểu Ngữ: Từ vựng","<b>喜欢上</b> (xǐhuan shàng) nghĩa là bắt đầu nảy sinh tình cảm hoặc sự yêu thích với một người hay một việc, và trạng thái ấy tiếp tục duy trì."],["Nội dung văn hóa","Bài lồng ghép không khí ngày Tết (过年) và sự sum họp gia đình, giúp hiểu thêm tầm quan trọng của Tết đoàn viên trong văn hóa Trung Quốc."]]};
B2[15]={t:"我想再去一次中国",vi:"Tôi muốn đi Trung Quốc thêm một lần nữa",v:P("Bài khóa 1 (Trong lớp học):姓名,xìngmíng,Họ tên@Bài khóa 2 (Trong quán cà phê):出国,chūguó,Đi nước ngoài;门票,ménpiào,Vé vào cửa;高中,gāozhōng,Trường cấp ba;出门,chūmén,Ra khỏi nhà;路,lù,Con đường/Tuyến đường@Danh từ riêng:颐和园,Yíhéyuán,Di Hòa Viên (Cung điện Mùa hè ở Bắc Kinh)@Bài khóa 3 (Trong quán cà phê):机场,jīchǎng,Sân bay;机票,jīpiào,Vé máy bay;飞,fēi,Bay@Bài khóa 4 (Nhật ký của Lý Văn):好像,hǎoxiàng,Hình như/Giống như;鸟,niǎo,Con chim"),
g:[["Bổ ngữ động lượng (1)","Cấu trúc <b>động từ + số từ + 次</b> biểu thị số lần một hành động hoặc sự việc xảy ra.","我去过<b>一次</b>中国。"],["Bổ ngữ động lượng (2)","Tân ngữ là danh từ chỉ người hoặc địa điểm: bổ ngữ động lượng đặt trước hoặc sau tân ngữ. Tân ngữ là đại từ nhân xưng: bổ ngữ động lượng phải đặt sau tân ngữ.","去过中国<b>一次</b> · 去过<b>一次</b>中国 · 见过他<b>两次</b>"],["Câu chữ 有 (2)","Cấu trúc <b>有 + cụm số lượng</b> biểu thị việc đạt đến một số lượng hoặc mức độ nhất định.","我们班<b>有五十个</b>学生。"],["Nội dung mở rộng của Tiểu Ngữ (15-1)","<b>中国240小时过境免签政策</b>: chính sách miễn thị thực quá cảnh 240 giờ, tạo điều kiện cho du khách quốc tế tham quan Trung Quốc trong thời gian ngắn khi đang quá cảnh."],["Mục tiêu bài học","Thảo luận về kế hoạch du lịch và dùng thành thạo bổ ngữ động lượng để diễn đạt tần suất của các hoạt động trong đời sống."]]};
const B3=D[3]={};
B3[1]={t:"我们去机场接你们",vi:"Chúng tôi đi sân bay đón các bạn",v:P("Bài khóa 1 (Ở nhà):以为,yǐwéi,tưởng là;像,xiàng,giống;长,zhǎng,trưởng thành/mọc;身高,shēngāo,chiều cao;米,mǐ,mét;瘦,shòu,gầy;接,jiē,đón@Bài khóa 2 (Tại sân bay):行李,xíngli,hành lý;丢,diū,mất;箱子,xiāngzi,cái hòm/va li;号码,hàomǎ,số;好像,hǎoxiàng,hình như;重要,zhòngyào,quan trọng;着急,zháojí,lo lắng;护照,hùzhào,hộ chiếu;服务台,fúwùtái,quầy phục vụ@Bài khóa 3 (Tại sân bay):应该,yīnggāi,nên;站,zhàn,đứng;中间,zhōngjiān,ở giữa;短,duǎn,ngắn;头发,tóufa,tóc;年轻,niánqīng,trẻ trung@Bài khóa 4 (Trong phòng khách sạn):发现,fāxiàn,phát hiện;不见,bújiàn,không thấy/mất;带,dài,mang theo;帮助,bāngzhù,giúp đỡ;照片,zhàopiàn,bức ảnh"),
g:[["Cụm từ cố định 看上去 / 看起来","Dùng để miêu tả ngoại hình của một người hoặc trạng thái, vẻ bề ngoài của một sự vật.","他<b>看上去</b>很年轻。"],["Cách dùng phi nghi vấn của đại từ nghi vấn (1)","Các từ 哪儿, 什么, 谁, 哪 được dùng để chỉ địa điểm, sự vật hoặc người không xác định, hoặc không cần nêu rõ trong câu trần thuật.","我好像在<b>哪儿</b>见过你。"],["Định ngữ đa tầng","Khi một danh từ có nhiều định ngữ, thứ tự thường là: Thời gian/Địa điểm → Hành động/Trạng thái → Đặc điểm.","我<b>昨天丢的黑色</b>箱子"],["Mục tiêu bài học","Nắm vững cách mô tả đặc điểm ngoại hình của người hoặc vật và cách xử lý tình huống khi bị mất đồ vật."],["Hoạt động lớp học","Thực hành đóng vai trong tình huống đón người tại sân bay và tình huống lạc mất hộ chiếu tại sân bay."]]};
B3[2]={t:"你们想吃什么就点什么",vi:"Các bạn muốn ăn gì cứ gọi nấy",v:P("Bài khóa 1 (Trong nhà hàng):菜单,càidān,thực đơn;又,yòu,lại;饿,è,đói;渴,kě,khát;客气,kèqi,khách sáo;饮料,yǐnliào,đồ uống;好久,hǎojiǔ,đã lâu@Bài khóa 2 (Trong nhà hàng):服务,fúwù,phục vụ;员,yuán,nhân viên;双,shuāng,đôi/lượng từ;筷子,kuàizi,đũa;勺子,sháozi,thìa;碗,wǎn,bát;马上,mǎshàng,ngay lập tức;热情,rèqíng,nhiệt tình;尝,cháng,nếm;记,jì,nhớ;用,yòng,dùng@Bài khóa 3 (Trong nhà hàng):鸡,jī,gà;张,zhāng,tờ/lượng từ cho giấy / ảnh;不用,búyòng,không cần;外卖,wàimài,đồ mang về;方便,fāngbiàn,thuận tiện@Bài khóa 4 (Nhật ký của Lý Văn):蛋糕,dàngāo,bánh ngọt;只,zhǐ,chỉ;方便面,fāngbiànmiàn,mì ăn liền;简单,jiǎndān,đơn giản"),
g:[["Câu phức đẳng lập 又……又……","Kết hợp với tính từ để biểu thị một đối tượng có hai đặc tính cùng tồn tại.","他<b>又</b>饿<b>又</b>渴。 (vừa đói vừa khát)"],["Cách dùng phi nghi vấn của đại từ nghi vấn (2)","Đại từ nghi vấn kết hợp với phó từ 都 để biểu thị nghĩa bao hàm toàn bộ, chỉ bất kỳ ai hoặc bất kỳ sự vật nào.","我<b>什么都</b>喜欢吃。"],["Cách dùng phi nghi vấn của đại từ nghi vấn (3)","Hai đại từ nghi vấn giống nhau cùng chỉ một đối tượng hoặc cách thức, tạo cấu trúc “A sao thì B vậy”.","你想吃<b>什么</b>就点<b>什么</b>。"],["Ghi chú của Tiểu Ngữ: 上/下 + Lượng từ + Danh từ","Dùng để chỉ trình tự thời gian: 上 chỉ quá khứ (tuần trước), 下 chỉ tương lai (tuần sau).","<b>上</b>个星期 · <b>下</b>个月"],["Nội dung mở rộng của Tiểu Ngữ","<b>筷子</b> (Đũa): giới thiệu văn hóa và cách sử dụng đũa của người Trung Quốc trên bàn ăn."],["Hoạt động lớp học","Thảo luận nhóm về sở thích ăn uống: ăn tại nhà hàng, gọi đồ mang về hay tự nấu ăn tại nhà."]]};
B3[3]={t:"这个小区挺好的",vi:"Khu dân cư này khá tốt",v:P("Bài khóa 1 (Thảo luận việc chuyển nhà):初中,chūzhōng,trung học cơ sở;咱们,zánmen,chúng ta;换,huàn,đổi/thay;房子,fángzi,nhà/ngôi nhà;小区,xiǎoqū,khu dân cư;环境,huánjìng,môi trường/xung quanh;挺,tǐng,khá/rất;空调,kòngtiáo,máy lạnh;洗衣机,xǐyījī,máy giặt;层,céng,tầng;花园,huāyuán,vườn/hoa viên@Bài khóa 2 (Dọn dẹp nhà mới):灯,dēng,đèn;关,guān,tắt/đóng;冰箱,bīngxiāng,tủ lạnh;卫生间,wèishēngjiān,nhà vệ sinh;打扫,dǎsǎo,dọn dẹp/quét dọn;搬家,bānjiā,chuyển nhà@Bài khóa 3 (Làm thẻ tín dụng):办,bàn,làm/giải quyết;信用卡,xìnyòngkǎ,thẻ tín dụng;还,huán,trả lại;听说,tīngshuō,nghe nói;银行,yínháng,ngân hàng;才,cái,mới/chỉ/vừa mới@Bài khóa 4 (Nhật ký chuyển nhà):纸,zhǐ,giấy;搬,bān,dời/chuyển/bê;需要,xūyào,cần/nhu cầu"),
g:[["Phó từ chỉ mức độ 挺","Thường dùng trong khẩu ngữ để biểu đạt mức độ cao. Cấu trúc: 挺 + tính từ/động từ tâm lý + 的.","这个小区<b>挺</b>好<b>的</b>。"],["Bổ ngữ mức độ (1) 坏了","Đặt sau tính từ để biểu thị mức độ cực kỳ cao, ngữ khí phóng đại, thường dùng cho tình huống tiêu cực.","忙<b>坏了</b> (bận phát điên) · 渴<b>坏了</b> (khát khô cả cổ)"],["So sánh 就 và 才","<b>就</b> biểu thị hành động xảy ra sớm, nhanh chóng hoặc thuận lợi. <b>才</b> biểu thị hành động xảy ra muộn, chậm trễ hoặc không suôn sẻ.","我七点<b>就</b>到了。 · 他八点<b>才</b>到。"],["Ghi chú của Tiểu Ngữ: Đại từ","<b>咱们</b> (zánmen) bao gồm cả người nói và người nghe, thường dùng trong khẩu ngữ thân mật ở miền Bắc Trung Quốc."],["Nội dung mở rộng của Tiểu Ngữ 3-1","<b>在中国租房</b> (Thuê nhà ở Trung Quốc): kiến thức thực tế về quy trình và những lưu ý khi tìm thuê căn hộ tại các thành phố lớn."],["Mục tiêu bài học","Có thể nói về môi trường sống, nhà cửa và các thiết bị gia dụng cơ bản."]]};
B3[4]={t:"这家宾馆跟别的都不一样",vi:"Khách sạn này không giống những khách sạn khác",v:P("Bài khóa 1 (Kế hoạch đi thảo nguyên):假期,jiàqī,kỳ nghỉ/lễ;海,hǎi,biển;草原,cǎoyuán,thảo nguyên;主意,zhǔyi,ý kiến/ý tưởng;骑,qí,cưỡi;马,mǎ,ngựa;羊,yáng,cừu/dê;月亮,yuèliang,mặt trăng;一定,yídìng,nhất định@Bài khóa 2 (Đặt vé và khách sạn):刻,kè,15 phút/khắc;起飞,qǐfēi,cất cánh;宾馆,bīnguǎn,khách sạn;特别,tèbié,đặc biệt;别的,biéde,cái khác/người khác;一样,yíyàng,giống nhau;牛,niú,bò;相机,xiàngjī,máy ảnh@Bài khóa 3 (Gặp tài xế đón):欢迎,huānyíng,hoan nghênh/chào mừng;司机,sījī,tài xế;晚点,wǎndiǎn,đến muộn/trễ chuyến;久,jiǔ,lâu;除了,chúle,ngoài... ra;以外,yǐwài,ngoài... ra;先,xiān,trước"),
g:[["Cấu trúc cố định 一……也/都 + 不/没……","Biểu đạt sự phủ định hoàn toàn một sự vật hoặc trạng thái.","<b>一</b>点儿<b>也不</b>冷 (một chút cũng không lạnh)"],["Câu so sánh (9) A 跟 B 一样","Biểu thị A và B có đặc điểm giống nhau. Phủ định là “A 跟 B 不一样”.","这家宾馆<b>跟</b>别的<b>不一样</b>。"],["Cấu trúc cố định 除了……（以外），……都/还/也……","Khi dùng với <b>都</b>: biểu thị loại trừ (ngoại trừ A, tất cả đều…). Khi dùng với <b>还/也</b>: biểu thị bổ sung (ngoài A ra, vẫn còn B…).","<b>除了</b>小王<b>以外</b>，大家<b>都</b>来了。"],["Ghi chú của Tiểu Ngữ","<b>一刻</b> (yí kè) tương đương 15 phút. Cụm <b>不一样</b> có thể dùng để nhấn mạnh sự độc đáo hoặc khác biệt của một địa điểm so với những nơi khác."],["Hoạt động lớp học","Thiết kế một kế hoạch du lịch cho kỳ nghỉ, gồm địa điểm, phương tiện, sắp xếp chỗ ở và các hoạt động hằng ngày."],["Mục tiêu bài học","Có thể thảo luận về kế hoạch kỳ nghỉ và bày tỏ cảm nhận trong quá trình đi du lịch."]]};
B3[5]={t:"这样的照片才好看",vi:"Những bức ảnh như thế này mới đẹp",v:P("Bài khóa 1 (Rủ nhau đi leo núi):总是,zǒngshì,luôn luôn;终于,zhōngyú,cuối cùng;爬,pá,leo/bò;山,shān,núi;锻炼,duànliàn,rèn luyện/tập thể dục;照,zhào,chụp;鞋,xié,giày;大衣,dàyī,áo khoác@Bài khóa 2 (Thảo luận về việc chụp ảnh):拍照,pāizhào,chụp ảnh;感兴趣,gǎn xìngqù,cảm thấy thú vị/quan tâm;照相,zhàoxiàng,chụp hình;难看,nánkàn,xấu/khó coi;比较,bǐjiào,khá là/so sánh;水平,shuǐpíng,trình độ/mức độ@Bài khóa 3 (Chụp ảnh trên núi):太阳,tàiyáng,mặt trời;树,shù,cây;干,gàn,làm;电,diàn,điện@Bài khóa 4 (Thư điện tử gửi cho Gia Nguyệt):收到,shōudào,nhận được;封,fēng,lượng từ cho thư/email;邮件,yóujiàn,thư điện tử;难过,nánguò,buồn bã;哈哈,hāhā,tiếng cười;音乐,yīnyuè,âm nhạc;兴趣,xìngqù,hứng thú;会,huì,cuộc tụ họp/buổi liên hoan;结束,jiéshù,kết thúc"),
g:[["Bổ ngữ mức độ (2) 得很","Đứng sau tính từ để biểu thị mức độ cao, thường dùng trong khẩu ngữ.","天气好<b>得很</b>。 (thời tiết cực tốt)"],["Lặp lại lượng từ","Nhấn mạnh mọi thành viên trong một phạm vi nhất định đều có đặc điểm chung.","<b>张张</b>都漂亮。 (tấm nào cũng đẹp)"],["Câu tồn tại (3)","Diễn tả sự xuất hiện hoặc biến mất của người/vật tại một địa điểm. Cấu trúc: Nơi chốn + Động từ + Bổ ngữ/Trợ từ + Số lượng + Người/Vật.","我们班<b>来了三位</b>新同学。"],["Câu phức rút gọn ……了……就……","Biểu thị hai hành động xảy ra nối tiếp nhau ngay lập tức.","听完<b>了</b>音乐会<b>就</b>来我家吃饭。"],["Ghi chú của Tiểu Ngữ: 又","Phó từ <b>又</b> trong bài này chỉ một tình huống lặp lại mang tính quy luật.","明天<b>又</b>是星期天。"],["Nội dung mở rộng của Tiểu Ngữ 5-1","<b>大银幕上的中国故事</b>: giới thiệu về điện ảnh Trung Quốc."],["Mục tiêu bài học","Có thể giới thiệu các hoạt động giải trí yêu thích và miêu tả thứ tự các hành động liên tiếp."]]};
B3[6]={t:"高铁上还可以点外卖",vi:"Trên tàu cao tốc còn có thể đặt đồ ăn ngoài",v:P("Bài khóa 1 (Bàn về việc đi Thượng Hải):该,gāi,nên/đến lúc;打算,dǎsuàn,dự định;高铁,gāotiě,tàu cao tốc;行,xíng,được/ổn@Bài khóa 2 (Trên đường đến ga tàu):路口,lùkǒu,giao lộ/ngã tư;小心,xiǎoxīn,cẩn thận;迟到,chídào,đến muộn;红绿灯,hónglǜdēng,đèn giao thông;后来,hòulái,sau đó/về sau;急,jí,lo lắng/vội vàng;如果,rúguǒ,nếu;以前,yǐqián,trước đây@Bài khóa 3 (Tại ga tàu):耳机,ěrjī,tai nghe;充电宝,chōngdiànbǎo,sạc dự phòng;常用,chángyòng,thường dùng;越,yuè,càng;分开,fēnkāi,tách ra/chia ra;检查,jiǎnchá,kiểm tra;刷,shuā,quét/quẹt thẻ;检票,jiǎnpiào,soát vé;电梯,diàntī,thang máy/thang cuốn@Bài khóa 4 (Kể về chuyến đi Thượng Hải):放假,fàngjià,nghỉ lễ/nghỉ phép;沙发,shāfā,ghế sô pha;安静,ānjìng,yên tĩnh;选择,xuǎnzé,lựa chọn;必须,bìxū,phải/nhất thiết@Danh từ riêng:北京南站,Běijīng Nánzhàn,Ga Nam Bắc Kinh"),
g:[["Cấu trúc cố định 该……了","Biểu đạt đã đến thời điểm cần thực hiện một việc gì đó.","<b>该</b>买票<b>了</b>。 (Đến lúc mua vé rồi)"],["Câu phức giả thiết 如果……，就……","Phân câu đầu đưa ra giả thiết, phân câu sau đưa ra kết quả của giả thiết đó.","<b>如果</b>没走错，二十分钟以前<b>就</b>到了。"],["Cụm từ cố định 越来越","Diễn tả mức độ của sự vật/trạng thái thay đổi theo thời gian.","前面的人<b>越来越</b>多。"],["Ghi chú của Tiểu Ngữ: 上","<b>上</b> trong ngữ cảnh này không chỉ phương hướng mà biểu thị đã đạt được một mục tiêu hoặc nguyện vọng.","坐<b>上</b>高铁 (lên được tàu cao tốc)"],["Nội dung mở rộng của Tiểu Ngữ 6-1","<b>12306 是什么？</b>: tìm hiểu về hệ thống đặt vé tàu trực tuyến chính thức của Trung Quốc."],["Văn hóa & Đời sống","Phương thức giao thông hiện đại của Trung Quốc: hệ thống tàu cao tốc và dịch vụ đặt đồ ăn trên tàu."]]};
B3[7]={t:"那条裙子比短裤更好看",vi:"Chiếc váy đó đẹp hơn quần soóc",v:P("Phần khởi động (Warm-up):西瓜,xīguā,dưa hấu;香蕉,xiāngjiāo,chuối;自行车,zìxíngchē,xe đạp;裙子,qúnzi,váy;钱,qián,tiền;短裤,duǎnkù,quần soóc@Bài khóa 1 (Ở nhà, bàn việc mua xe đạp):辆,liàng,chiếc - lượng từ cho xe;旧,jiù,cũ;矮,ǎi,thấp/lùn;试,shì,thử@Bài khóa 2 (Tại trung tâm thương mại, chọn quần áo):黄色,huángsè,màu vàng;大小,dàxiǎo,kích cỡ;合适,héshì,phù hợp;更,gèng,càng/hơn nữa;决定,juédìng,quyết định@Bài khóa 4 (Ở nhà, xem TV):结婚,jiéhūn,kết hôn;不但,búdàn,không những;而且,érqiě,mà còn;声,shēng,tiếng/âm thanh;开机,kāijī,khởi động máy"),
g:[["Câu liên động (2)","Dùng trợ từ động thái 着 sau động từ thứ nhất để biểu thị trạng thái hoặc phương thức thực hiện hành động thứ hai. Cấu trúc: Động từ 1 + 着 + Động từ 2.","他骑<b>着</b>自行车去学校。"],["Câu so sánh (10) A 不比 B + tính từ","Thường dùng để nhấn mạnh tình trạng của hai đối tượng gần như nhau, hoặc để phản bác nhận định của người khác.","这件<b>不比</b>那件贵。"],["Bổ ngữ mức độ (3) 极了","Đặt sau tính từ hoặc động từ tâm lý để biểu đạt mức độ cao nhất của tính chất hoặc cảm xúc.","好看<b>极了</b> · 高兴<b>极了</b>"],["Câu phức tăng tiến 不但……，而且……","Liên kết hai phân câu theo quan hệ tăng tiến, bổ sung ý nghĩa cho nhau.","他<b>不但</b>会唱歌，<b>而且</b>唱得很好。"],["Ghi chú của Tiểu Ngữ","Trong câu so sánh có thể dùng <b>还</b> hoặc <b>更</b> trước tính từ để biểu thị mức độ sâu hơn. Thuật ngữ mua sắm <b>买二送一</b> nghĩa là “mua hai tặng một”."],["Nội dung mở rộng của Tiểu Ngữ 7-1","<b>中国人购物方式的转变</b>: sự phát triển từ mua sắm truyền thống sang thương mại điện tử hiện đại."]]};
B3[8]={t:"今天我出院了",vi:"Hôm nay tôi xuất viện rồi",v:P("Phần khởi động (Warm-up):耳朵,ěrduo,tai;腿,tuǐ,chân;发烧,fāshāo,sốt;病人,bìngrén,bệnh nhân;感冒,gǎnmào,cảm cúm;胖,pàng,béo/mập@Bài khóa 2 (Trong lớp học, Annie hỏi thăm Thiên Trung):低,dī,thấp;关心,guānxīn,quan tâm;注意,zhùyì,chú ý@Bài khóa 3 (Trong phòng bệnh, Annie đi thăm Thiên Trung):突然,tūrán,đột nhiên;住院,zhùyuàn,nằm viện;担心,dānxīn,lo lắng;差不多,chàbuduō,xấp xỉ/gần như;得,děi,phải/cần;开心,kāixìn,vui vẻ@Bài khóa 4 (Ở nhà, Thiên Trung uống thuốc và nghỉ ngơi):出院,chūyuàn,xuất viện;开,kāi,kê đơn thuốc;种,zhǒng,loại/loài;方法,fāngfǎ,phương pháp;其他,qítā,cái khác/người khác;心里,xīnlǐ,trong lòng/tâm trí"),
g:[["Cách dùng mở rộng của bổ ngữ xu hướng (1) 下去","Đặt sau động từ hoặc tính từ để biểu thị hành động hoặc trạng thái đang diễn ra sẽ tiếp tục duy trì trong tương lai.","你说<b>下去</b>吧。 (Bạn cứ nói tiếp đi)"],["Từ ly hợp (2)","Khi câu có bổ ngữ, các thành phần bổ ngữ thường phải đặt vào giữa hai thành phần của từ ly hợp.","我们见<b>了两次</b>面。"],["Bổ ngữ thời lượng (2)","Biểu thị khoảng thời gian tính từ khi hành động đã kết thúc cho đến thời điểm hiện tại.","他出院<b>三天</b>了。"],["Cấu trúc cố định ……以前/以后/前/后","Biểu thị thời gian hoặc sự kiện xảy ra trước hoặc sau một mốc thời gian nhất định.","吃饭<b>以前</b>要洗手。 · 三天<b>前</b> · 一个月<b>后</b>"],["Mục tiêu bài học","Nghe hiểu và mô tả quá trình đi khám bệnh, dùng thuốc; thảo luận về các thói quen sức khỏe."],["Nội dung mở rộng của Tiểu Ngữ 8-1","<b>在中国看病</b> (Khám bệnh ở Trung Quốc): tổng quan về hệ thống y tế và quy trình đi khám chữa bệnh."]]};
B3[9]={t:"打不好没关系",vi:"Đánh không tốt cũng không sao",v:P("Bài khóa 1 (Tại cửa thư viện):校园,xiàoyuán,khuôn viên trường;卡,kǎ,thẻ;球场,qiúchǎng,sân bóng;为了,wèile,để/vì;运动会,yùndònghuì,đại hội thể thao;男生,nánshēng,nam sinh;练,liàn,luyện tập;参加,cānjiā,tham gia;网球,wǎngqiú,quần vợt;比赛,bǐsài,thi đấu/trận đấu;练习,liànxí,luyện tập@Bài khóa 2 (Trong khuôn viên trường):好多,hǎoduō,rất nhiều;几乎,jīhū,hầu như/gần như;只是,zhǐshì,chỉ là@Bài khóa 3 (Tại nhà Lý Văn):啤酒,píjiǔ,bia;回,huí,lượng từ cho sự việc/trận đấu;紧张,jǐnzhāng,căng thẳng/hồi hộp;主要,zhǔyào,chủ yếu/chính;受到,shòudào,nhận được/bị;影响,yǐngxiǎng,ảnh hưởng;得分,défēn,ghi điểm@Bài khóa 4 (Lý Văn chuẩn bị bài phát biểu):体育,tǐyù,thể thao;世界,shìjiè,thế giới;运动员,yùndòngyuán,vận động viên;得到,dédào,đạt được;成绩,chéngjì,thành tích@Danh từ riêng:奥运会,Àoyùnhuì,Thế vận hội Olympic;刘长春,Liú Chángchūn,Lưu Trường Xuân"),
g:[["Câu phức mục đích 为了……，……","Phân câu bắt đầu bằng 为了 chỉ mục đích, phân câu còn lại chỉ hành động để đạt được mục đích đó.","<b>为了</b>参加比赛，他每天都练习。"],["Bổ ngữ khả năng","Thêm 得 hoặc 不 vào giữa động từ và bổ ngữ kết quả/xu hướng để biểu thị điều kiện có cho phép thực hiện hành động đó hay không.","打<b>得</b>好 (đánh tốt được) · 听<b>不</b>懂 (nghe không hiểu được)"],["Cấu trúc cố định 越 A 越 B","Biểu thị mức độ của B thay đổi theo sự thay đổi của A.","这场比赛<b>越</b>看<b>越</b>着急。"],["Ghi chú của Tiểu Ngữ","Trong các môn như cầu lông hay bóng chuyền, <b>接</b> mang nghĩa là đỡ bóng hoặc đánh trả lại bóng."],["Mục tiêu bài học","Giới thiệu về các trận thi đấu thể thao, tên vận động viên và thảo luận về khả năng thực hiện các hoạt động thể chất."]]};
B3[10]={t:"你明天再把书还给我",vi:"Ngày mai bạn hãy trả sách cho mình",v:P("Phần khởi động (Warm-up):办公室,bàngōngshì,văn phòng;黑板,hēibǎn,bảng đen;数学,shùxué,toán học;考试,kǎoshì,thi cử;历史,lìshǐ,lịch sử;成绩,chéngjì,thành tích/điểm số@Bài khóa 3 (Tại văn phòng giáo viên):页,yè,trang;对话,duìhuà,đối thoại;明白,míngbai,hiểu/rõ ràng;讲,jiǎng,giảng/nói;句,jù,lượng từ cho câu;句子,jùzi,câu@Từ vựng bổ sung:还,huán / hái,Trả lại (huán) / Vẫn còn (hái)"),
g:[["Câu chữ 把 (1)","Biểu đạt một hành động tác động lên đối tượng xác định làm thay đổi vị trí của nó. Cấu trúc: Chủ ngữ + (phủ định/động từ năng nguyện) + 把 + Tân ngữ + Động từ + 在/到 + Địa điểm.","老师<b>把</b>作业放<b>在</b>桌子上了。"],["Cấu trúc cố định 在……上/中/下","Kết hợp 在 với các từ chỉ phương vị để biểu thị phạm vi, phương diện, thời gian hoặc điều kiện.","<b>在</b>学习<b>上</b> (về mặt học tập) · <b>在</b>他的影响<b>下</b> (dưới ảnh hưởng của anh ấy)"],["Câu chữ 把 (2)","Biểu thị sự chuyển giao quyền sở hữu hoặc quan hệ của sự vật qua hành động. Cấu trúc: Chủ ngữ + 把 + Tân ngữ + Động từ + 给 + Tân ngữ 2.","请你<b>把</b>这本书<b>给</b>他。"],["Văn hóa & Giáo dục","Tìm hiểu về hệ thống giáo dục và chế độ thi cử, thăng cấp của Trung Quốc."],["Kỹ năng học tập","Thảo luận về các phương pháp học tập hiệu quả, cách ghi chép trên lớp và xử lý khi gặp bài tập khó."]]};
B3[11]={t:"看来我没办法解决这个问题",vi:"Có vẻ như tôi không có cách nào giải quyết vấn đề này",v:P("Bài khóa 1 (Trong văn phòng):会议,huìyì,cuộc họp;经理,jīnglǐ,giám đốc;开会,kāihuì,họp;后天,hòutiān,ngày mốt;地点,dìdiǎn,địa điểm;室,shì,phòng;发,fā,gửi;笔记本电脑,bǐjìběn diànnǎo,máy tính xách tay;或者,huòzhě,hoặc@Bài khóa 2 (Trong phòng họp):声音,shēngyīn,âm thanh;看来,kànlái,xem ra/có vẻ;办法,bànfǎ,cách/biện pháp;解决,jiějué,giải quyết;只能,zhǐnéng,chỉ có thể;别人,biérén,người khác@Bài khóa 3 (Trong văn phòng):请假,qǐngjià,xin nghỉ;同事,tóngshì,đồng nghiệp;休假,xiūjià,nghỉ phép;怕,pà,sợ/lo rằng;邮箱,yóuxiāng,hòm thư điện tử/email@Bài khóa 4 (Tại nhà):愿意,yuànyì,bằng lòng/tự nguyện;城市,chéngshì,thành phố;离开,líkāi,rời khỏi;机会,jīhuì,cơ hội;生活,shēnghuó,cuộc sống/sinh sống;为,wèi,vì/cho;或,huò,hoặc@Danh từ riêng:老张,Lǎo Zhāng,Lão Trương"),
g:[["So sánh 还是 và 或者","Cả hai đều biểu thị sự lựa chọn. <b>还是</b> thường dùng trong câu nghi vấn, <b>或者</b> dùng trong câu trần thuật.","我们周一<b>或者</b>周二开会。"],["Cụm từ cố định 看来","Đứng trước một kết luận được đưa ra dựa trên sự quan sát và suy nghĩ về tình hình hiện tại.","<b>看来</b>我没办法解决这个问题。"],["Câu chữ 把 (3)","Kết hợp động từ với bổ ngữ kết quả để biểu đạt hành động tác động lên đối tượng cụ thể và tạo ra kết quả nhất định.","我已经<b>把</b>房间打扫<b>干净</b>了。"],["Cấu trúc cố định 对……来说","Chỉ rõ quan điểm, cảm nhận hoặc đối tượng mà tình huống/vấn đề đó thuộc về.","<b>对</b>我<b>来说</b>，这个机会很重要。"],["Ghi chú của Tiểu Ngữ","<b>接</b> trong bài này mang nghĩa “kết nối/cắm dây” (ví dụ kết nối máy tính với thiết bị khác)."],["Mục tiêu bài học","Nghe hiểu và giao tiếp về các tình huống công việc, thảo luận về sự lựa chọn nghề nghiệp và cảm nhận cá nhân về công việc."]]};
B3[12]={t:"这个季节天气变化很快",vi:"Mùa này thời tiết thay đổi rất nhanh",v:P("Bài khóa 1 (Trên đường):街,jiē,đường phố;开花,kāihuā,nở hoa;公园,gōngyuán,công viên;船,chuán,thuyền;工作日,gōngzuòrì,ngày làm việc;地方,dìfang,địa điểm/nơi@Bài khóa 2 (Trên đường):刚才,gāngcái,vừa nãy;刮,guā,thổi;风,fēng,gió;新闻,xīnwén,tin tức;伞,sǎn,ô/dù;借,jiè,mượn/cho mượn;把,bǎ,lượng từ cho vật có tay cầm;雨衣,yǔyī,áo mưa;变,biàn,biến đổi;季节,jìjié,mùa;变化,biànhuà,sự thay đổi@Bài khóa 3 (Trong lớp học):冬天,dōngtiān,mùa đông;常常,chángcháng,thường xuyên;关注,guānzhù,quan tâm/chú ý đến@Bài khóa 4 (Tại nhà):四季,sìjì,bốn mùa;春天,chūntiān,mùa xuân;夏天,xiàtiān,mùa hè;凉快,liángkuai,mát mẻ;秋天,qiūtiān,mùa thu;叶子,yèzi,lá cây;变成,biànchéng,trở thành/biến thành"),
g:[["Câu phức lựa chọn 或者……，或者……","Biểu thị sự lựa chọn giữa hai hoặc nhiều khả năng, thường dùng nhiều trong khẩu ngữ.","我<b>或者</b>去公园，<b>或者</b>在家休息。"],["Cách dùng mở rộng của bổ ngữ xu hướng (2) 起来","Đặt sau động từ hoặc tính từ để biểu thị hành động hoặc trạng thái bắt đầu diễn ra và sẽ tiếp tục duy trì.","天突然冷<b>起来</b>了。 · 突然刮<b>起</b>风<b>来</b>"],["Phó từ phạm vi 就","Dùng trước cụm số lượng để biểu thị người nói cho rằng số lượng đó là ít, mức độ thấp hoặc thời gian ngắn.","今天的会<b>就</b>来了三个人。"],["Cách dùng mở rộng của bổ ngữ xu hướng (3) 下来","Dùng sau động từ để chỉ việc hoàn thành một hành động cần tốn nhiều thời gian, công sức hoặc phải vượt qua khó khăn.","他终于坚持<b>下来</b>了。"],["Ghi chú của Tiểu Ngữ","Cấu trúc <b>不 A 不 B</b> chỉ trạng thái vừa phải, cân bằng.","<b>不</b>冷<b>不</b>热 (không lạnh không nóng)"],["Nội dung mở rộng của Tiểu Ngữ 12-1","<b>中国四季的代表城市</b>: các thành phố tiêu biểu cho bốn mùa của Trung Quốc."],["Mục tiêu bài học","Thảo luận về sự thay đổi thời tiết, giới thiệu đặc điểm khí hậu địa phương và bày tỏ sở thích cá nhân về các mùa trong năm."]]};
B3[13]={t:"我的新邻居来自英国",vi:"Hàng xóm mới của tôi đến từ nước Anh",v:P("Bài khóa 1 (Trong nhà hàng):请客,qǐngkè,mời khách/bao đãi;南方,nánfāng,phương Nam;北方,běifāng,phương Bắc;做法,zuòfǎ,cách làm;不同,bùtóng,khác nhau;加,jiā,thêm vào;的话,dehuà,nếu/dùng cuối vế giả thiết;做客,zuòkè,làm khách@Bài khóa 2 (Tại nhà):邻居,línjū,hàng xóm;放心,fàngxīn,yên tâm;酒,jiǔ,rượu;客人,kèrén,khách@Bài khóa 3 (Trong bữa tiệc sinh nhật):晚会,wǎnhuì,tiệc tối/buổi liên hoan;礼物,lǐwù,quà tặng;画家,huàjiā,họa sĩ;盘子,pánzi,cái đĩa;一边,yìbiān,vừa... vừa;聊天儿,liáotiānr,tán gẫu/nói chuyện@Bài khóa 4 (Nhật ký của Vương Y Tuyết):来自,láizì,đến từ;夫妻,fūqī,vợ chồng;直到,zhídào,cho đến khi;地图,dìtú,bản đồ;点,diǎn,điểm/dấu chấm;感到,gǎndào,cảm thấy;东方,dōngfāng,phương Đông;文化,wénhuà,văn hóa@Danh từ riêng:英国,Yīngguó,Nước Anh"),
g:[["Câu phức giả thiết ……的话，就……","Vế đầu nêu giả thiết, vế sau nêu kết quả hoặc kết luận dựa trên giả thiết đó.","明天下雨<b>的话</b>，我们<b>就</b>不去了。"],["Câu chữ 把 (4)","Động từ sau 把 kết hợp với bổ ngữ xu hướng hoặc bổ ngữ trạng thái để biểu thị hành động gây ra sự thay đổi vị trí hoặc trạng thái của đối tượng xác định.","请<b>把</b>行李送<b>到</b>房间<b>去</b>。"],["Câu phức song hành 一边……，一边……","Diễn tả hai hành động được thực hiện cùng một lúc.","他们<b>一边</b>聊天儿，<b>一边</b>吃饭。"],["Ghi chú của Tiểu Ngữ: Tiền tố và hậu tố","Dùng <b>老</b> làm tiền tố trước họ (老张), và các hậu tố như <b>员</b> (nhân viên/vận động viên) hoặc <b>家</b> (chuyên gia trong lĩnh vực nghệ thuật/khoa học như 画家)."],["Mục tiêu bài học","Nghe hiểu và thảo luận về sự khác biệt trong thói quen sinh hoạt giữa các vùng miền, biết cách dùng các lời chúc và cảm ơn lịch sự."]]};
B3[14]={t:"这本书被别人借走了",vi:"Quyển sách này bị người khác mượn rồi",v:P("Phần khởi động (Warm-up):词典,cídiǎn,từ điển;报纸,bàozhǐ,báo;图书馆,túshūguǎn,thư viện;电子书,diànzǐshū,sách điện tử;班级,bānjí,lớp học;校长,xiàozhǎng,hiệu trưởng@Bài khóa 3 (Hội thoại về buổi biểu diễn):女生,nǚshēng,nữ sinh;表演,biǎoyǎn,biểu diễn;节目,jiémù,tiết mục/chương trình;怎么办,zěnme bàn,làm sao bây giờ;面前,miànqián,trước mặt;相信,xiāngxìn,tin tưởng/tin là@Bài khóa 4 (Nhật ký của Bạch Gia Nguyệt):新年,xīnnián,năm mới;跳,tiào,nhảy/khiêu vũ;留学生,liúxuéshēng,du học sinh;最后,zuìhòu,cuối cùng;一块儿,yíkuàir,Cùng nhau;网站,wǎngzhàn,trang web;视频,shìpín,video"),
g:[["Câu bị động (1) với 被","Nhấn mạnh chủ ngữ là đối tượng chịu tác động của hành động. Cấu trúc: Đối tượng chịu tác động + 被 + Tác nhân (có thể lược bỏ) + Động từ + Thành phần khác.","这本书<b>被</b>别人借走了。"],["Câu phức liên tiếp 先……，再/然后……","Diễn tả trình tự của các hành động xảy ra nối tiếp nhau.","你<b>先</b>洗手，<b>再</b>吃饭。"],["Cấu trúc cố định ×什么 (啊)","Thường dùng trong khẩu ngữ để bác bỏ sự lo lắng, nghi ngờ hoặc để an ủi đối phương.","急<b>什么</b>？ (Việc gì phải vội?)"],["Mục tiêu bài học","Nghe hiểu và giới thiệu về các hoạt động ngoại khóa tại trường học, biết cách khích lệ và cổ vũ người khác."],["Hoạt động lớp học","Kể về một “ngày xui xẻo” (倒霉的一天) của bản thân bằng cách dùng linh hoạt các câu bị động."]]};
B3[15]={t:"我是半个南京人",vi:"Tôi là một nửa người Nam Kinh",v:P("Bài khóa 1 (Trong văn phòng):蓝,lán,xanh lam;段,duàn,lượng từ - đoạn/khoảng;附近,fùjìn,lân cận/gần đây;马路,mǎlù,đường cái;平时,píngshí,bình thường/lúc bình thường;放学,fàngxué,tan học;游戏,yóuxì,trò chơi;老人,lǎorén,người già;根据,gēnjù,căn cứ vào@Bài khóa 2 (Trong văn phòng):了解,liǎojiě,hiểu biết/tìm hiểu;可是,kěshì,nhưng;以上,yǐshàng,trở lên/trên;有名,yǒumíng,nổi tiếng;景点,jǐngdiǎn,địa điểm tham quan;游客,yóukè,du khách;外地,wàidì,nơi khác/phương xa;聊,liáo,trò chuyện@Bài khóa 3 (Trong văn phòng):河,hé,sông;关系,guānxì,quan hệ;养,yǎng,nuôi dưỡng@Bài khóa 4 (Nhật ký của Vương Y Tuyết):西北,xīběi,Tây Bắc;经过,jīngguò,trải qua/đi qua;草地,cǎodì,thảm cỏ/đồng cỏ;遇见,yùjiàn,gặp gỡ/tình cờ gặp@Danh từ riêng:南京,Nánjīng,Nam Kinh;黄河,Huáng Hé,Sông Hoàng Hà"),
g:[["Giới từ 根据","Dùng để đưa ra căn cứ, cơ sở hoặc lý do cho một hành động hoặc kết luận.","<b>根据</b>新闻，明天会下雨。"],["Lặp lại cụm số lượng","Cấu trúc Số từ + Lượng từ + Số từ + Lượng từ, thường làm trạng ngữ để miêu tả động tác diễn ra tuần tự, sinh động.","<b>一点儿一点儿</b>地喝 (uống từng chút một)"],["Cụm từ cố định 在……看来","Diễn đạt quan điểm, góc nhìn của một cá nhân hoặc một nhóm đối tượng cụ thể.","<b>在</b>我<b>看来</b>，这个办法很好。"],["Cụm từ cố định 不一会儿","Làm trạng ngữ chỉ thời gian, biểu thị một khoảng thời gian rất ngắn đã trôi qua.","<b>不一会儿</b>，他就回来了。"],["Từ vựng bổ sung (Siêu cấp)","<b>景点</b> (danh lam thắng cảnh), <b>草地</b> (bãi cỏ)."],["Nội dung mở rộng của Tiểu Ngữ 15-1","<b>长江与黄河</b>: hai con sông biểu tượng, được coi là cái nôi của nền văn minh Trung Hoa."],["Mục tiêu bài học","Giới thiệu về môi trường sống, đặc điểm địa lý và các địa danh nổi tiếng của một thành phố."]]};

g:[["Câu phức song hành 一会儿……，一会儿……","Diễn tả hai động tác hoặc trạng thái khác nhau xảy ra luân phiên trong một khoảng thời gian ngắn.","大熊猫<b>一会儿</b>睡觉，<b>一会儿</b>吃竹子。"],["Giới từ 关于","Dùng để giới thiệu đối tượng, phạm vi mà sự việc hoặc nội dung liên quan đến.","<b>关于</b>大熊猫，我知道得不多。"],["Cụm từ cố định 一般来说","Thường đặt ở đầu câu để chỉ tình huống phổ biến, đa số trường hợp là như vậy.","<b>一般来说</b>，大熊猫喜欢吃竹子。"],["Câu so sánh (11)","Dùng 比 khi vị ngữ là động từ thường. Có thể thêm các phó từ như 多, 少, 早, 晚 để nhấn mạnh sự chênh lệch.","他<b>比</b>我<b>早</b>到了十分钟。"],["Từ vựng bổ sung (Siêu cấp)","<b>国宝</b> (bảo vật quốc gia), <b>全</b> (tất cả), <b>野生</b> (hoang dã), <b>竹子</b> (tre), <b>半天</b> (một lúc lâu)."],["Ghi chú của Tiểu Ngữ","Giới thiệu bộ sách nổi tiếng <b>十万个为什么</b> (Một trăm nghìn câu hỏi vì sao), nguồn tri thức khoa học phổ biến cho trẻ em Trung Quốc. Ngoài ra, <b>又</b> được dùng để nhấn mạnh một hành động lặp lại."],["Nội dung mở rộng của Tiểu Ngữ 16-1","<b>大熊猫的“明星”生活</b>: đời sống “ngôi sao” của loài vật được coi là đại sứ văn hóa của Trung Quốc."]]};

function route(){const h=location.hash.slice(1);let m=/^hsk(\d)-t(\d)$/.exec(h);if(m)return{lv:+m[1],ls:0,tab:"v",t:+m[2]};if(/^hsk\d-d$/.test(h))return{lv:+h[3],ls:0,tab:"v",d:1};m=/^hsk(\d)(?:-l(\d+))?(?:-([vgqmd]))?$/.exec(h);return m?{lv:+m[1],ls:m[2]?+m[2]:0,tab:m[3]||"v"}:{lv:0,ls:0,tab:"v"}}

function render(){
 const r=route(),Ls=D[r.lv],L=Ls&&Ls[r.ls];
 $("#back").style.display=r.lv?"block":"none";
 $("#crumb").textContent=r.lv?"HSK "+r.lv+(L?" › Bài "+r.ls:r.t?" › Kiểm tra "+r.t:r.d?" › Luyện dịch":""):"";
 const A=$("#app");A.style.animation="none";A.offsetWidth;A.style.animation="";
 if(!r.lv)home();else if(!Ls)soon(r.lv);else if(r.d&&(r.lv==1||r.lv==2||r.lv==3))xlevel();else if(r.t&&r.lv==1&&TR[r.t-1])tintro(r.t);else if(!L)lessons(r.lv);else lesson(r,L);

function lessons(n){
 $("#app").innerHTML=`<h2 class="h2">HSK ${n} · Chọn bài học</h2><div class="lg">`+Object.entries(D[n]).map(([k,L])=>`<a class="lsn" href="#hsk${n}-l${k}-v"><i>Bài ${k}</i><div><div class="t hz">${L.t}</div><div class="v">${L.vi} · ${L.v.length} từ</div></div></a>`).join("")+"</div>"+((n==2||n==3)?XL2(n):"")+(n==1?`<h2 class="h2" style="margin-top:30px">Luyện dịch</h2><div class="lg"><a class="lsn" href="#hsk1-d"><i style="background:var(--gold);color:#2b1512">Dịch</i><div><div class="t">Luyện dịch tổng hợp HSK 1</div><div class="v">Việt – Trung và Trung – Việt · 12 câu từ tất cả các bài</div></div></a></div><h2 class="h2" style="margin-top:30px">Kiểm tra HSK 1</h2><div class="lg">`+TR.map((r,i)=>`<a class="lsn" href="#hsk1-t${i+1}"><i style="background:var(--gold);color:#2b1512">Test ${i+1}</i><div><div class="t">${TN[i]}</div><div class="v">30 câu · nhận chứng chỉ theo hạng</div></div></a>`).join("")+"</div>":"");

function tintro(n){
 $("#app").innerHTML=`<div class="q"><h2 style="margin:0">Bài kiểm tra ${n}</h2><p class="qh">${TN[n-1]} · 30 câu hỏi đa dạng: điền từ, chọn nghĩa, chọn chữ Hán, chọn pinyin, nghe, đúng/sai, gõ pinyin. Bạn có thể chuyển qua lại giữa các câu, đánh dấu câu cần xem lại và bấm Nộp bài khi chốt. Sau khi nộp, bạn sẽ xem được lời giải thích vì sao đúng, vì sao sai.</p><div>`+TI.map((t,i)=>`<span class="tg">${MD(t[1],18)} ${t[2]}: ${i<4?"≥"+t[0]:"dưới 15"}</span>`).join("")+`</div><input id="nm" class="inp" maxlength="30" placeholder="Nhập tên của bạn để in lên chứng chỉ"><button class="pri" onclick="tstart(${n})">Bắt đầu làm bài</button></div>`;
}
function tbuild(n){
 const[a,b]=TR[n-1],seen={},pool=[];
 for(let i=a;i<=b;i++)D[1][i].v.forEach(w=>{if(!seen[w[0]]){seen[w[0]]=1;pool.push(w)}});
 const W=sh(pool);let k=0,ci=0;const nx=()=>W[k++%W.length];
 const od=(w,f)=>sh([w,...sh(pool.filter(x=>x[0]!=w[0]&&x[2]!=w[2]&&x[1]!=w[1])).slice(0,3)]).map(f);
 const cz=sh(CZ.filter(c=>c[0]>=a&&c[0]<=b));
 return sh("cccchhhhhhmmmmmppppqqqqlllttyy".split("")).map(t=>{
  if(t=="c"){const c=cz[ci++%cz.length];return{q:"Điền từ vào chỗ trống:",cz:1,big:c[1],vi:1,a:c[2],o:sh([c[2],...c[3]])}}
  const w=nx();
  if(t=="h")return{q:"Nghĩa của từ này là gì?",big:w[0],sub:w[1],a:w[2],o:od(w,x=>x[2]),say:w[0]};
  if(t=="m")return{q:"Chọn chữ Hán đúng với nghĩa:",big:w[2],vi:1,a:w[0],o:od(w,x=>x[0])};
  if(t=="p")return{q:"Chọn chữ Hán đúng với pinyin:",big:w[1],vi:1,a:w[0],o:od(w,x=>x[0])};
  if(t=="q")return{q:"Chọn pinyin đúng của chữ này:",big:w[0],a:w[1],o:od(w,x=>x[1])};
  if(t=="l")return{q:"Nghe và chọn nghĩa đúng:",big:IC("speaker"),a:w[2],o:od(w,x=>x[2]),say:w[0],auto:1};
  if(t=="t"){const ok=Math.random()<.5,o=ok?w:sh(pool.filter(x=>x[2]!=w[2]))[0];return{q:"Đúng hay Sai?",big:w[0]+" = "+o[2],vi:1,a:ok?"Đúng":"Sai",o:["Đúng","Sai"]}}
  return{q:"Gõ pinyin (không cần dấu):",big:w[0],sub:w[2],a:w[1],ty:1};
 });
}
const ALLV=[];for(let i=1;i<=15;i++)D[1][i].v.forEach(w=>ALLV.push([...w,i]));

function fb(q){
 if(q.cz)return"Câu hoàn chỉnh: "+q.big.replace("____","【"+q.a+"】");

8:["我 爸爸 在 医院 工作。|wǒ bàba zài yīyuàn gōngzuò.|Bố tôi làm việc ở bệnh viện.|Giới từ 在 + địa điểm đứng trước động từ, khác với thứ tự tiếng Việt.","桌子 下 有 一 只 猫。|zhuōzi xià yǒu yì zhī māo.|Dưới bàn có một con mèo.|Câu tồn tại: nơi chốn + 有 + người/vật; 只 là lượng từ của con vật nhỏ.","你 能 去 学校 吗？|nǐ néng qù xuéxiào ma?|Bạn có thể đến trường không?|能 biểu thị khả năng khách quan, đứng trước động từ.","医生 的 病人 很 多。|yīshēng de bìngrén hěn duō.|Bệnh nhân của bác sĩ rất đông.|的 nối định ngữ với trung tâm ngữ; 很 đứng trước tính từ 多."],
9:["我 明天 上午 在 学校 学习。|wǒ míngtiān shàngwǔ zài xuéxiào xuéxí.|Sáng mai tôi học ở trường.|Khi có cả thời gian và địa điểm làm trạng ngữ, thời gian đứng trước địa điểm.","桌子 上 有 一 本 书。|zhuōzi shang yǒu yì běn shū.|Trên bàn có một quyển sách.|Câu tồn tại: nơi chốn + 有 + vật; 本 là lượng từ của sách; 上 sau danh từ đọc nhẹ.","那 是 第 三 课。|nà shì dì sān kè.|Kia là bài thứ ba.|第 + số tạo thành số thứ tự.","我 和 朋友 在 家里 看 电视。|wǒ hé péngyou zài jiāli kàn diànshì.|Tôi và bạn xem tivi ở nhà.|和 nối hai danh từ; địa điểm (在家里) đứng trước động từ."],
10:["这儿 的 苹果 真 便宜！|zhèr de píngguǒ zhēn piányi!|Táo ở đây rẻ thật!|Câu vị ngữ tính từ: tính từ làm vị ngữ trực tiếp, thường đi với 真 hoặc 很.","那 件 衣服 怎么样？|nà jiàn yīfu zěnmeyàng?|Chiếc áo kia thế nào?|怎么样 hỏi tình trạng, tính chất hoặc xin ý kiến; 件 là lượng từ của quần áo.","苹果 多少 钱 一 斤？|píngguǒ duōshao qián yì jīn?|Táo bao nhiêu tiền một cân?|Hỏi giá: 多少钱 đặt sau món hàng, đơn vị tính (一斤) đứng cuối.","杯子 三 块 五。|bēizi sān kuài wǔ.|Cái cốc giá 3,5 tệ.|Trong khẩu ngữ, 块 = 元; số lẻ cuối cùng thường lược đơn vị 毛."],
11:["我 读 大学 呢。|wǒ dú dàxué ne.|Tôi đang học đại học.|呢 cuối câu cho biết trạng thái đang diễn ra.","他 正在 看 电视剧。|tā zhèngzài kàn diànshìjù.|Anh ấy đang xem phim truyền hình.|正在 đứng trước động từ để biểu thị hành động đang diễn ra.","你 有没有 时间？|nǐ yǒuméiyǒu shíjiān?|Bạn có thời gian không?|Câu chính phản của 有 phải là 有没有, không dùng 有不有.","我 要 去 考试。|wǒ yào qù kǎoshì.|Tôi sắp đi thi.|要 biểu thị ý muốn hoặc kế hoạch sắp thực hiện, đứng trước động từ."],
12:["下雨 了。|xià yǔ le.|Mưa rồi.|Câu không chủ ngữ dùng tả thời tiết; 了 cuối câu cho thấy tình huống mới xuất hiện.","今天 太 冷 了！|jīntiān tài lěng le!|Hôm nay lạnh quá!|Cấu trúc 太……了 biểu thị mức độ cao, mang sắc thái cảm thán.","我 想 喝 热 水。|wǒ xiǎng hē rè shuǐ.|Tôi muốn uống nước nóng.|Tính từ 热 đứng trước danh từ 水; người Trung Quốc thích uống nước nóng.","我 觉得 有点儿 冷。|wǒ juéde yǒudiǎnr lěng.|Tôi cảm thấy hơi lạnh.|有点儿 đứng trước tính từ, thường chỉ mức độ “hơi” theo hướng không thoải mái."],
13:["请 给 我 一 杯 茶。|qǐng gěi wǒ yì bēi chá.|Làm ơn cho tôi một tách trà.|给 mang hai tân ngữ: người nhận (我) trước, vật (一杯茶) sau.","我 可以 坐 这儿 吗？|wǒ kěyǐ zuò zhèr ma?|Tôi có thể ngồi ở đây không?|可以 dùng để xin phép; 吗 ở cuối câu tạo câu hỏi.","我 想 问 一下。|wǒ xiǎng wèn yíxià.|Tôi muốn hỏi một chút.|一下 đặt sau động từ để hành động nhẹ nhàng, ngắn gọn.","请 给 我 两 个 鸡蛋。|qǐng gěi wǒ liǎng gè jīdàn.|Làm ơn cho tôi hai quả trứng gà.|Trước lượng từ dùng 两; cấu trúc song tân ngữ với 给."],
14:["我 看 了 一 个 电影。|wǒ kàn le yí gè diànyǐng.|Tôi đã xem một bộ phim.|了 đặt ngay sau động từ để biểu thị hành động đã hoàn thành.","我们 都 是 学生。|wǒmen dōu shì xuésheng.|Chúng tôi đều là học sinh.|都 đứng trước động từ, bao quát toàn bộ đối tượng đã nêu ở trước.","火车 中午 开。|huǒchē zhōngwǔ kāi.|Tàu hỏa chạy vào buổi trưa.|Từ chỉ thời gian (中午) đứng trước động từ (开).","你 不要 说话。|nǐ búyào shuōhuà.|Đừng nói chuyện.|不要 đặt trước động từ để ngăn cản; 说话 là từ ly hợp (động từ + tân ngữ)."],
15:["我 爱 吃 饺子， 也 爱 吃 面条儿。|wǒ ài chī jiǎozi, yě ài chī miàntiáor.|Tôi thích ăn bánh chẻo, cũng thích ăn mì.|Câu phức liên hợp: hai vế bổ sung ý, dùng 也 ở vế sau.","我 去年 去 了 北京。|wǒ qùnián qù le Běijīng.|Năm ngoái tôi đã đến Bắc Kinh.|Thời gian (去年) đứng trước động từ; 了 sau 去 biểu thị đã hoàn thành.","坐 飞机 要 三 个 小时。|zuò fēijī yào sān gè xiǎoshí.|Đi máy bay mất ba tiếng.|要 biểu thị khoảng thời gian cần thiết để làm việc gì.","我 在 机场 接 家人。|wǒ zài jīchǎng jiē jiārén.|Tôi đón người nhà ở sân bay.|在 + địa điểm đứng trước động từ 接."]}};

const XD3={1:["他 看上去 很 年轻。|tā kànshangqu hěn niánqīng.|Anh ấy trông rất trẻ.|看上去 dùng để miêu tả ngoại hình hoặc vẻ bề ngoài.","我 好像 在 哪儿 见过 你。|wǒ hǎoxiàng zài nǎr jiànguo nǐ.|Hình như tôi đã gặp bạn ở đâu đó rồi.|哪儿 dùng phi nghi vấn, chỉ một nơi không xác định.","这 是 我 昨天 丢 的 黑色 箱子。|zhè shì wǒ zuótiān diū de hēisè xiāngzi.|Đây là chiếc va li màu đen hôm qua tôi làm mất.|Định ngữ nhiều tầng: “我昨天丢的” (hành động) đứng trước, “黑色” (đặc điểm) đứng sát danh từ.","我 发现 护照 不见 了， 很 着急。|wǒ fāxiàn hùzhào bújiàn le, hěn zháojí.|Tôi phát hiện hộ chiếu biến mất rồi, rất lo lắng.|不见 了 biểu thị đồ vật mất đi, không còn thấy nữa."],2:["他 又 饿 又 渴。|tā yòu è yòu kě.|Anh ấy vừa đói vừa khát.|又……又…… nối hai tính từ cùng tồn tại ở một đối tượng.","这里 的 菜 我 什么 都 喜欢。|zhèlǐ de cài wǒ shénme dōu xǐhuan.|Món ở đây tôi món gì cũng thích.|Đại từ nghi vấn + 都 biểu thị bao hàm toàn bộ.","你 想 吃 什么 就 点 什么。|nǐ xiǎng chī shénme jiù diǎn shénme.|Bạn muốn ăn gì thì gọi món đó.|Hai đại từ nghi vấn giống nhau cùng chỉ một đối tượng: A sao thì B vậy.","请 给 我 一 双 筷子。|qǐng gěi wǒ yì shuāng kuàizi.|Làm ơn cho tôi một đôi đũa.|双 là lượng từ cho vật thành đôi như đũa, giày."],3:["这个 小区 的 环境 挺 好 的。|zhège xiǎoqū de huánjìng tǐng hǎo de.|Môi trường của khu dân cư này khá tốt.|挺……的 biểu thị mức độ khá cao, thường dùng trong khẩu ngữ.","今天 忙 坏 了， 我 渴 坏 了。|jīntiān máng huài le, wǒ kě huài le.|Hôm nay bận phát điên, tôi khát khô cả cổ.|Tính từ + 坏了 biểu thị mức độ cực cao, ngữ khí phóng đại.","我 七 点 就 到 了。|wǒ qī diǎn jiù dào le.|Tôi bảy giờ đã đến rồi.|就 biểu thị việc xảy ra sớm hoặc thuận lợi.","他 八 点 才 到。|tā bā diǎn cái dào.|Tám giờ anh ấy mới đến.|才 biểu thị việc xảy ra muộn hoặc không suôn sẻ."],4:["今天 一点儿 也 不 冷。|jīntiān yìdiǎnr yě bù lěng.|Hôm nay một chút cũng không lạnh.|一……也+不…… biểu thị phủ định hoàn toàn.","这 家 宾馆 跟 别的 不 一样。|zhè jiā bīnguǎn gēn biéde bù yíyàng.|Khách sạn này không giống những khách sạn khác.|A 跟 B 一样/不一样 dùng để so sánh mức độ giống nhau.","飞机 八 点 一 刻 起飞。|fēijī bā diǎn yí kè qǐfēi.|Máy bay cất cánh lúc tám giờ mười lăm.|一刻 bằng 15 phút.","除了 小王 以外， 大家 都 来 了。|chúle Xiǎo Wáng yǐwài, dàjiā dōu lái le.|Ngoài Tiểu Vương ra, mọi người đều đến rồi.|除了……以外，……都…… biểu thị loại trừ."],5:["今天 天气 好得很。|jīntiān tiānqì hǎo de hěn.|Hôm nay thời tiết cực tốt.|得很 đặt sau tính từ biểu thị mức độ cao, thường dùng trong khẩu ngữ.","这些 照片 张张 都 很 漂亮。|zhèxiē zhàopiàn zhāngzhāng dōu hěn piàoliang.|Những tấm ảnh này tấm nào cũng đẹp.|Lượng từ lặp lại 张张 nhấn mạnh mọi cái trong phạm vi đều như vậy.","我们 班 来 了 三 位 新 同学。|wǒmen bān lái le sān wèi xīn tóngxué.|Lớp chúng tôi có thêm ba bạn mới.|Câu tồn tại diễn tả sự xuất hiện: nơi chốn + động từ + 了 + số lượng + người.","听 完 了 音乐会 就 来 我 家 吃饭。|tīng wán le yīnyuèhuì jiù lái wǒ jiā chīfàn.|Nghe xong buổi hòa nhạc là đến nhà tôi ăn cơm.|……了……就…… biểu thị hai hành động nối tiếp nhau ngay lập tức."],6:["该 买 票 了。|gāi mǎi piào le.|Đến lúc mua vé rồi.|该……了 biểu thị đã đến lúc làm một việc gì đó.","如果 没 走 错， 二十 分钟 以前 就 到 了。|rúguǒ méi zǒu cuò, èrshí fēnzhōng yǐqián jiù dào le.|Nếu không đi nhầm thì hai mươi phút trước đã đến rồi.|如果……就…… nêu giả thiết ở vế đầu và kết quả ở vế sau.","前面 的 人 越来越 多。|qiánmiàn de rén yuèláiyuè duō.|Người phía trước càng lúc càng đông.|越来越 + tính từ biểu thị mức độ tăng dần theo thời gian.","我们 终于 坐 上 了 高铁。|wǒmen zhōngyú zuò shàng le gāotiě.|Cuối cùng chúng tôi cũng lên được tàu cao tốc.|上 sau động từ biểu thị đã đạt được mục tiêu hoặc nguyện vọng."],7:["他 骑 着 自行车 去 学校。|tā qí zhe zìxíngchē qù xuéxiào.|Anh ấy đạp xe đến trường.|Câu liên động với 着: động từ 1 + 着 chỉ phương thức của hành động thứ hai.","这 件 衣服 不 比 那 件 贵。|zhè jiàn yīfu bù bǐ nà jiàn guì.|Bộ quần áo này không đắt hơn bộ kia.|A 不比 B + tính từ: nhấn mạnh hai đối tượng gần như nhau hoặc phản bác nhận định.","这 条 裙子 好看 极了。|zhè tiáo qúnzi hǎokàn jí le.|Chiếc váy này đẹp cực kỳ.|极了 đặt sau tính từ biểu thị mức độ cao nhất.","他 不但 会 唱歌， 而且 唱 得 很 好。|tā búdàn huì chànggē, érqiě chàng de hěn hǎo.|Anh ấy không những biết hát mà còn hát rất hay.|不但……而且…… nối hai vế theo quan hệ tăng tiến."],8:["你 说 下去 吧。|nǐ shuō xiàqù ba.|Bạn cứ nói tiếp đi.|下去 sau động từ biểu thị hành động đang diễn ra sẽ tiếp tục.","我们 见 了 两 次 面。|wǒmen jiàn le liǎng cì miàn.|Chúng tôi đã gặp nhau hai lần.|Từ ly hợp 见面: bổ ngữ đặt vào giữa hai thành phần của từ.","他 出院 三 天 了。|tā chūyuàn sān tiān le.|Anh ấy xuất viện được ba ngày rồi.|Bổ ngữ thời lượng chỉ khoảng thời gian từ khi hành động kết thúc đến nay.","吃饭 以前 要 洗手。|chīfàn yǐqián yào xǐshǒu.|Trước khi ăn cơm phải rửa tay.|……以前 biểu thị trước một mốc thời gian hoặc một sự việc."],9:["为了 参加 比赛， 他 每天 都 练习。|wèile cānjiā bǐsài, tā měitiān dōu liànxí.|Để tham gia thi đấu, ngày nào anh ấy cũng luyện tập.|为了 mở đầu vế chỉ mục đích.","这个 字 你 看 得 懂 吗？|zhège zì nǐ kàn de dǒng ma?|Chữ này bạn đọc hiểu được không?|Bổ ngữ khả năng: động từ + 得 + bổ ngữ kết quả.","我 听 不 懂 他 说 的 话。|wǒ tīng bu dǒng tā shuō de huà.|Tôi nghe không hiểu lời anh ấy nói.|Dạng phủ định của bổ ngữ khả năng dùng 不 thay cho 得.","这 场 比赛 越 看 越 着急。|zhè chǎng bǐsài yuè kàn yuè zháojí.|Trận đấu này càng xem càng sốt ruột.|越 A 越 B: mức độ của B thay đổi theo A."],10:["老师 把 作业 放 在 桌子 上 了。|lǎoshī bǎ zuòyè fàng zài zhuōzi shang le.|Thầy giáo đã để bài tập lên bàn rồi.|把 + tân ngữ + động từ + 在 + địa điểm: biểu thị sự thay đổi vị trí.","你 明天 再 把 书 还 给 我。|nǐ míngtiān zài bǎ shū huán gěi wǒ.|Ngày mai bạn hãy trả sách cho mình.|把……给…… biểu thị chuyển giao; 还 ở đây đọc là huán (trả lại).","在 学习 上， 他 帮助 了 我 很 多。|zài xuéxí shang, tā bāngzhù le wǒ hěn duō.|Về mặt học tập, anh ấy đã giúp tôi rất nhiều.|在……上 biểu thị phương diện, phạm vi.","请 你 把 这 本 书 给 他。|qǐng nǐ bǎ zhè běn shū gěi tā.|Bạn hãy đưa quyển sách này cho anh ấy nhé.|Câu chữ 把 với 给 biểu thị sự chuyển giao."],11:["我们 周一 或者 周二 开会。|wǒmen zhōuyī huòzhě zhōu'èr kāihuì.|Chúng ta họp vào thứ Hai hoặc thứ Ba.|或者 dùng trong câu trần thuật, còn 还是 thường dùng trong câu hỏi.","看来 我 没 办法 解决 这个 问题。|kànlái wǒ méi bànfǎ jiějué zhège wèntí.|Có vẻ như tôi không có cách nào giải quyết vấn đề này.|看来 đứng trước kết luận rút ra từ việc quan sát tình hình.","我 已经 把 房间 打扫 干净 了。|wǒ yǐjīng bǎ fángjiān dǎsǎo gānjìng le.|Tôi đã dọn sạch phòng rồi.|把 + tân ngữ + động từ + bổ ngữ kết quả: hành động tạo ra kết quả nhất định.","对 我 来说， 这个 机会 很 重要。|duì wǒ láishuō, zhège jīhuì hěn zhòngyào.|Đối với tôi, cơ hội này rất quan trọng.|对……来说 nêu đối tượng mà nhận định thuộc về."],12:["周末 我 或者 去 公园， 或者 在 家 休息。|zhōumò wǒ huòzhě qù gōngyuán, huòzhě zài jiā xiūxi.|Cuối tuần tôi hoặc đi công viên, hoặc ở nhà nghỉ ngơi.|或者……，或者…… biểu thị lựa chọn giữa các khả năng.","天 突然 冷 起来 了。|tiān tūrán lěng qǐlái le.|Trời đột nhiên lạnh lên rồi.|起来 sau tính từ/động từ biểu thị trạng thái bắt đầu và tiếp tục.","今天 的 会 就 来 了 三 个 人。|jīntiān de huì jiù lái le sān ge rén.|Cuộc họp hôm nay chỉ có ba người đến.|就 đặt trước cụm số lượng: người nói cho rằng số lượng ít.","他 终于 坚持 下来 了。|tā zhōngyú jiānchí xiàlái le.|Cuối cùng anh ấy đã kiên trì vượt qua được.|下来 chỉ việc hoàn thành điều cần nhiều thời gian, công sức hoặc phải vượt khó."],13:["明天 下雨 的话， 我们 就 不 去 了。|míngtiān xiàyǔ dehuà, wǒmen jiù bú qù le.|Nếu ngày mai mưa thì chúng ta không đi nữa.|……的话，就…… vế đầu nêu giả thiết, vế sau nêu kết quả.","请 把 行李 送 到 房间 去。|qǐng bǎ xíngli sòng dào fángjiān qù.|Làm ơn mang hành lý đến phòng giúp.|把 + động từ + bổ ngữ xu hướng: làm thay đổi vị trí của đối tượng xác định.","他们 一边 聊天儿， 一边 吃饭。|tāmen yìbiān liáotiānr, yìbiān chīfàn.|Họ vừa trò chuyện vừa ăn cơm.|一边……一边…… diễn tả hai hành động diễn ra cùng lúc.","我 的 新 邻居 来自 英国。|wǒ de xīn línjū láizì Yīngguó.|Hàng xóm mới của tôi đến từ nước Anh.|来自 + nơi chốn biểu thị nguồn gốc."],14:["这 本 书 被 别人 借 走 了。|zhè běn shū bèi biérén jiè zǒu le.|Quyển sách này bị người khác mượn đi rồi.|被 + tác nhân + động từ + thành phần khác: nhấn mạnh chủ ngữ chịu tác động.","我 的 自行车 被 人 骑 走 了。|wǒ de zìxíngchē bèi rén qí zǒu le.|Xe đạp của tôi bị người ta đạp đi mất rồi.|Tác nhân có thể là 人 chung chung; sau động từ phải có thành phần khác như 走 了.","你 先 洗手， 再 吃饭。|nǐ xiān xǐshǒu, zài chīfàn.|Bạn rửa tay trước rồi hãy ăn cơm.|先……，再/然后…… diễn tả trình tự các hành động nối tiếp.","急 什么 啊， 时间 还 早。|jí shénme a, shíjiān hái zǎo.|Vội gì chứ, còn sớm mà.|×什么 (啊) dùng trong khẩu ngữ để bác bỏ lo lắng hoặc an ủi."],15:["根据 新闻， 明天 会 下雨。|gēnjù xīnwén, míngtiān huì xiàyǔ.|Theo tin tức thì ngày mai sẽ mưa.|根据 đưa ra căn cứ cho một kết luận.","他 把 水 一点儿 一点儿 地 喝 完 了。|tā bǎ shuǐ yìdiǎnr yìdiǎnr de hē wán le.|Anh ấy uống hết nước từng chút một.|Lặp cụm số lượng làm trạng ngữ: từng chút một.","在 我 看来， 这个 办法 很 好。|zài wǒ kànlái, zhège bànfǎ hěn hǎo.|Theo tôi thấy, cách này rất tốt.|在……看来 diễn đạt quan điểm của một cá nhân hoặc nhóm.","不 一会儿， 他 就 回来 了。|bù yíhuìr, tā jiù huílái le.|Chẳng bao lâu sau, anh ấy đã quay lại.|不一会儿 làm trạng ngữ chỉ khoảng thời gian rất ngắn."],16:["大熊猫 一会儿 睡觉， 一会儿 吃 竹子。|dàxióngmāo yíhuìr shuìjiào, yíhuìr chī zhúzi.|Gấu trúc lúc thì ngủ, lúc thì ăn trúc.|一会儿……一会儿…… diễn tả hai trạng thái luân phiên trong thời gian ngắn.","关于 大熊猫， 我 知道 得 不 多。|guānyú dàxióngmāo, wǒ zhīdào de bù duō.|Về gấu trúc, tôi biết không nhiều.|关于 giới thiệu đối tượng hoặc phạm vi nội dung liên quan.","一般 来说， 大熊猫 喜欢 吃 竹子。|yìbān láishuō, dàxióngmāo xǐhuan chī zhúzi.|Nói chung, gấu trúc thích ăn trúc.|一般来说 đặt đầu câu để chỉ tình huống phổ biến.","他 比 我 早 到 了 十 分钟。|tā bǐ wǒ zǎo dào le shí fēnzhōng.|Anh ấy đến sớm hơn tôi mười phút.|比 với động từ thường: thêm 早/晚/多/少 trước động từ, số lượng chỉ mức chênh lệch."],17:["我 要 向 他 学习。|wǒ yào xiàng tā xuéxí.|Tôi phải học hỏi anh ấy.|向 + đối tượng chỉ người mà hành động hướng tới.","你 不是 说 今天 来 吗？|nǐ búshì shuō jīntiān lái ma?|Chẳng phải bạn nói hôm nay sẽ đến sao?|不是……吗 là câu phản vấn, khẳng định mạnh mẽ hoặc bày tỏ ngạc nhiên.","这个 问题 很 难， 那个 更 难。|zhège wèntí hěn nán, nàge gèng nán.|Vấn đề này khó, vấn đề kia còn khó hơn.|……，更…… vế sau có mức độ cao hơn vế trước.","只有 努力 学习， 才 能 有 好 成绩。|zhǐyǒu nǔlì xuéxí, cái néng yǒu hǎo chéngjì.|Chỉ có chăm chỉ học tập thì mới có thành tích tốt.|只有……才…… điều kiện duy nhất dẫn đến kết quả."],18:["我 在 北京 住 了 七八 天。|wǒ zài Běijīng zhù le qī bā tiān.|Tôi đã ở Bắc Kinh bảy tám ngày.|Hai số từ liền kề biểu thị số ước lượng.","他 刚刚 到 家， 刚才 还 在 学校。|tā gānggāng dào jiā, gāngcái hái zài xuéxiào.|Anh ấy vừa mới về nhà, vừa nãy còn ở trường.|刚才 là danh từ thời gian, 刚刚 là phó từ.","只要 坚持， 就 能 完成 目标。|zhǐyào jiānchí, jiù néng wánchéng mùbiāo.|Chỉ cần kiên trì thì sẽ hoàn thành được mục tiêu.|只要……就…… điều kiện cần thiết, kết quả hiển nhiên.","从 明天 起， 我 每天 早上 跑步。|cóng míngtiān qǐ, wǒ měitiān zǎoshang pǎobù.|Từ ngày mai trở đi, sáng nào tôi cũng chạy bộ.|从……起 biểu thị mốc thời gian bắt đầu."]};
const XD2={1:["她 请 我们 吃 北京烤鸭。|tā qǐng wǒmen chī Běijīng kǎoyā.|Cô ấy mời chúng tôi ăn vịt quay Bắc Kinh.|Câu kiêm ngữ: 我们 vừa là tân ngữ của 请 vừa là chủ ngữ của 吃.","我 是 昨天 来 的。|wǒ shì zuótiān lái de.|Tôi đến vào hôm qua đấy.|Câu chữ 是……的 nhấn mạnh thời gian của việc đã xảy ra; phần nhấn mạnh nằm giữa 是 và 的.","不 好意思， 你 能 帮忙 吗？|bù hǎoyìsi, nǐ néng bāngmáng ma?|Ngại quá, bạn có thể giúp một chút không?|不好意思 dùng khi nhờ vả hoặc xin lỗi; 帮忙 là từ ly hợp.","你 是 学生 吧？|nǐ shì xuésheng ba?|Bạn là sinh viên đúng không?|吧 ở cuối câu nghi vấn thể hiện sự suy đoán, người nói chờ được xác nhận."],2:["还是 打车 去 北大 吧。|háishi dǎchē qù Běidà ba.|Hay là bắt taxi đi Bắc Đại đi.|还是……吧 biểu thị lựa chọn ưu tiên sau khi đã cân nhắc các phương án.","坐 公交车 很 便宜， 但 车站 太 远 了。|zuò gōngjiāochē hěn piányi, dàn chēzhàn tài yuǎn le.|Đi xe buýt rất rẻ nhưng bến xe xa quá.|但 mở đầu vế sau mang ý chuyển ngoặt; 太……了 biểu thị mức độ cao.","这个 学校 有 两万 多 名 学生。|zhège xuéxiào yǒu liǎng wàn duō míng xuésheng.|Trường này có hơn hai vạn sinh viên.|多 đặt sau số từ để chỉ số ước lượng lớn hơn số đó một chút; 名 là lượng từ chỉ người.","你 别 去 了， 票 已经 卖 完 了。|nǐ bié qù le, piào yǐjīng mài wán le.|Bạn đừng đi nữa, vé đã bán hết rồi.|别 đặt trước động từ để khuyên can; 卖完 là động từ kèm bổ ngữ kết quả."],3:["我 做 完 饭 了。|wǒ zuò wán fàn le.|Tôi nấu xong cơm rồi.|完 đặt sau động từ làm bổ ngữ kết quả, cho biết hành động đã hoàn tất.","你 想 一 想， 好 吗？|nǐ xiǎng yi xiǎng, hǎo ma?|Bạn nghĩ một chút nhé?|Dạng A 一 A của động từ đơn âm tiết biểu thị hành động ngắn, ngữ khí nhẹ nhàng.","我 自己 洗 手。|wǒ zìjǐ xǐ shǒu.|Tôi tự rửa tay.|自己 đứng trước động từ để nhấn mạnh tự mình làm.","你 为什么 不 和 我们 一起 出去？|nǐ wèishénme bù hé wǒmen yìqǐ chūqù?|Sao bạn không cùng chúng tôi đi ra ngoài?|为什么 và 不 đứng trước động từ; 一起 làm trạng ngữ."],4:["我 去 过 北京。|wǒ qù guo Běijīng.|Tôi đã từng đến Bắc Kinh.|过 đặt sau động từ để biểu thị đã từng có trải nghiệm; phủ định dùng 没(有)……过.","因为 红色 很 好看， 所以 我 买 了。|yīnwèi hóngsè hěn hǎokàn, suǒyǐ wǒ mǎi le.|Vì màu đỏ rất đẹp nên tôi đã mua.|因为 nêu nguyên nhân, 所以 nêu kết quả.","我 要 红色 的， 不 要 白色 的。|wǒ yào hóngsè de, bú yào báisè de.|Tôi muốn cái màu đỏ, không muốn cái màu trắng.|Tính từ + 的 đóng vai trò danh từ nên không cần lặp lại danh từ.","你 试试 那 条 裤子 吧。|nǐ shìshi nà tiáo kùzi ba.|Bạn thử cái quần kia đi.|试试 là dạng lặp của 试; 条 là lượng từ của quần; 吧 đưa ra đề nghị."],5:["请 进来。|qǐng jìnlái.|Mời vào.|Bổ ngữ xu hướng: người nói ở bên trong thì dùng 进来, nghĩa là tiến về phía người nói.","他 出去 了， 你 进来 吧。|tā chūqù le, nǐ jìnlái ba.|Anh ấy đi ra ngoài rồi, bạn vào đi.|出去 là rời xa người nói, 进来 là tiến về phía người nói.","都 十二 点 了， 我们 吃饭 吧。|dōu shíèr diǎn le, wǒmen chīfàn ba.|Đã mười hai giờ rồi, chúng ta ăn cơm đi.|都……了 nhấn mạnh sự việc đã đạt đến mức nào đó, thường mang ý giục giã.","我 给 奶奶 准备 了 礼物。|wǒ gěi nǎinai zhǔnbèi le lǐwù.|Tôi đã chuẩn bị quà cho bà.|给 + người nhận đứng trước động từ; 了 sau động từ biểu thị đã hoàn thành."],6:["小雪， 生日 快乐！|Xiǎoxuě, shēngrì kuàilè!|Tiểu Tuyết, sinh nhật vui vẻ!|生日快乐 là lời chúc sinh nhật quen thuộc.","这个 蛋糕 大大的， 很 漂亮。|zhège dàngāo dàdà de, hěn piàoliang.|Chiếc bánh kem to to, rất đẹp.|Tính từ đơn âm lặp AA + 的 làm tăng mức độ miêu tả, giọng thân mật.","桌子 上 有 鱼、 肉、 蛋糕 什么的。|zhuōzi shang yǒu yú, ròu, dàngāo shénmede.|Trên bàn có cá, thịt, bánh kem v.v.|什么的 đặt cuối phần liệt kê, tương đương “vân vân”.","孩子们 高兴 地 玩。|háizimen gāoxìng de wán.|Bọn trẻ vui vẻ chơi đùa.|地 đặt sau tính từ để tạo trạng ngữ bổ nghĩa cho động từ phía sau."],7:["他 篮球 打 得 很 好。|tā lánqiú dǎ de hěn hǎo.|Anh ấy chơi bóng rổ rất giỏi.|得 nối động từ với bổ ngữ trạng thái; tân ngữ 篮球 được đưa lên trước động từ.","他 跑步 跑 得 不 快。|tā pǎobù pǎo de bú kuài.|Anh ấy chạy không nhanh.|Phủ định đặt 不 trước tính từ ở bổ ngữ, không đặt trước động từ.","我 一 下课 就 去 踢 足球。|wǒ yí xiàkè jiù qù tī zúqiú.|Tôi vừa tan học là đi đá bóng.|一……就…… biểu thị hai hành động nối tiếp nhau.","你 游泳 游 得 怎么样？|nǐ yóuyǒng yóu de zěnmeyàng?|Bạn bơi thế nào?|Động từ có tân ngữ thì lặp lại động từ rồi mới thêm 得 + bổ ngữ."],8:["他 比 我 高。|tā bǐ wǒ gāo.|Anh ấy cao hơn tôi.|Câu so sánh: A + 比 + B + tính từ; không dùng 很 trước tính từ.","我 的 手表 比 你 的 贵。|wǒ de shǒubiǎo bǐ nǐ de guì.|Đồng hồ của tôi đắt hơn của bạn.|Sau 比 dùng “你的” thay cho “你的手表” để tránh lặp danh từ.","虽然 你 忘 了， 但是 我 记得。|suīrán nǐ wàng le, dànshì wǒ jìde.|Dù bạn quên rồi nhưng tôi vẫn nhớ.|虽然……但是…… vế sau nêu ý trái ngược với vế đầu.","今天 我 请 你 看 爱情片。|jīntiān wǒ qǐng nǐ kàn àiqíngpiàn.|Hôm nay tôi mời bạn xem phim tình cảm.|请 ở đây có nghĩa là 请客, tức mời khách, bao đãi."],9:["我 没有 他 那么 高。|wǒ méiyǒu tā nàme gāo.|Tôi không cao bằng anh ấy.|A + 没有 + B + 那么 + tính từ biểu thị A không bằng B.","咖啡店 离 这儿 很 近。|kāfēidiàn lí zhèr hěn jìn.|Quán cà phê cách đây rất gần.|A + 离 + B + khoảng cách: biểu thị khoảng cách giữa hai địa điểm.","我 在 北京 住 了 一 周。|wǒ zài Běijīng zhù le yì zhōu.|Tôi đã ở Bắc Kinh một tuần.|Bổ ngữ thời lượng đặt sau động từ để nói hành động kéo dài bao lâu.","他 去 买 了 一 杯 奶茶。|tā qù mǎi le yì bēi nǎichá.|Anh ấy đi mua một ly trà sữa.|Câu liên động: đi đâu (去) trước, làm gì (买) sau; 杯 là lượng từ của đồ uống."],10:["她 个子 很 高。|tā gèzi hěn gāo.|Cô ấy vóc dáng cao.|Câu vị ngữ cụm chủ–vị: 个子 很 高 làm vị ngữ miêu tả 她.","你 喝 茶 还是 喝 咖啡？|nǐ hē chá háishi hē kāfēi?|Bạn uống trà hay uống cà phê?|还是 đặt giữa hai phương án trong câu hỏi lựa chọn.","我们 就要 考试 了。|wǒmen jiùyào kǎoshì le.|Chúng ta sắp thi rồi.|就要……了 biểu thị sự việc sắp xảy ra trong tương lai gần.","火车 快要 开 了。|huǒchē kuàiyào kāi le.|Tàu hỏa sắp chạy rồi.|快要……了 cũng biểu thị sự việc sắp xảy ra."],11:["他 在 门口 坐 着。|tā zài ménkǒu zuò zhe.|Anh ấy đang ngồi ở cổng.|着 đặt sau động từ để biểu thị trạng thái đang duy trì.","我 最 喜欢 吃 中国菜。|wǒ zuì xǐhuan chī Zhōngguócài.|Tôi thích nhất là ăn món Trung Quốc.|最 đặt trước động từ tâm lý 喜欢 để chỉ mức độ cao nhất.","我 头 疼， 想 去 药店 买 药。|wǒ tóu téng, xiǎng qù yàodiàn mǎi yào.|Tôi đau đầu, muốn đến tiệm thuốc mua thuốc.|头疼 nghĩa là đau đầu; 去……买…… là câu liên động chỉ mục đích.","门 开 着 呢。|mén kāi zhe ne.|Cửa đang mở.|着 biểu thị trạng thái còn tồn tại sau khi hành động kết thúc."],12:["这里 比 北京 冷 多了。|zhèlǐ bǐ Běijīng lěng duō le.|Ở đây lạnh hơn Bắc Kinh nhiều.|比 + tính từ + 多了 biểu thị mức độ chênh lệch rất lớn.","今天 比 昨天 冷 得多。|jīntiān bǐ zuótiān lěng de duō.|Hôm nay lạnh hơn hôm qua nhiều.|得多 đặt sau tính từ trong câu 比, cùng nghĩa với 多了.","他 跑 得 比 我 快。|tā pǎo de bǐ wǒ kuài.|Anh ấy chạy nhanh hơn tôi.|So sánh mức độ thực hiện hành động: động từ + 得 + 比 + B + tính từ.","他 说 中文 说 得 比 我 好。|tā shuō Zhōngwén shuō de bǐ wǒ hǎo.|Anh ấy nói tiếng Trung giỏi hơn tôi.|Động từ có tân ngữ thì lặp lại động từ trước khi thêm 得."],13:["老师 教 我们 中文。|lǎoshī jiāo wǒmen Zhōngwén.|Cô giáo dạy chúng tôi tiếng Trung.|教 mang hai tân ngữ: người (我们) trước, nội dung (中文) sau.","他 送 给 我 一 个 蛋糕。|tā sòng gěi wǒ yí gè dàngāo.|Anh ấy tặng tôi một chiếc bánh kem.|送 kết hợp 给 mang hai tân ngữ: người nhận trước, vật được tặng sau.","我 比 他 大 三 岁。|wǒ bǐ tā dà sān suì.|Tôi lớn hơn anh ấy ba tuổi.|Cụm số lượng đặt sau tính từ để chỉ mức chênh lệch cụ thể.","今天 比 昨天 冷 一点儿。|jīntiān bǐ zuótiān lěng yìdiǎnr.|Hôm nay lạnh hơn hôm qua một chút.|一点儿 đặt sau tính từ để chỉ mức chênh lệch không lớn."],14:["前面 坐 着 一 位 老师。|qiánmiàn zuò zhe yí wèi lǎoshī.|Phía trước có một thầy giáo đang ngồi.|Câu tồn tại: địa điểm + động từ + 着 + người/vật; 位 là lượng từ lịch sự chỉ người.","一 个 人 过年 多 没意思 啊！|yí gè rén guònián duō méi yìsi a!|Một mình đón Tết thật vô vị quá!|多 + tính từ trong câu cảm thán biểu thị mức độ cao.","他 从 前面 跑 过来 了。|tā cóng qiánmiàn pǎo guòlái le.|Anh ấy từ phía trước chạy tới.|Bổ ngữ xu hướng phức 过来 chỉ hướng tiến về phía người nói.","她 喜欢上 了 跳舞。|tā xǐhuanshàng le tiàowǔ.|Cô ấy đã bắt đầu thích nhảy múa.|喜欢上 biểu thị bắt đầu nảy sinh yêu thích và trạng thái ấy tiếp tục duy trì."],15:["我 去 过 一 次 中国。|wǒ qù guo yí cì Zhōngguó.|Tôi đã đến Trung Quốc một lần.|Động từ + số từ + 次 biểu thị số lần; tân ngữ địa điểm có thể đứng sau bổ ngữ động lượng.","我 想 再 去 一 次 颐和园。|wǒ xiǎng zài qù yí cì Yíhéyuán.|Tôi muốn đến Di Hòa Viên thêm một lần nữa.|再 đặt trước động từ chỉ việc lặp lại trong tương lai.","我 见 过 他 两 次。|wǒ jiàn guo tā liǎng cì.|Tôi đã gặp anh ấy hai lần.|Tân ngữ là đại từ nhân xưng thì bổ ngữ động lượng phải đặt sau đại từ.","我们 班 有 五十 个 学生。|wǒmen bān yǒu wǔshí gè xuésheng.|Lớp chúng tôi có đến năm mươi sinh viên.|有 + cụm số lượng biểu thị đạt đến một số lượng nhất định."]};

  const r=await sm(p,{modelTier:"quick",onText:x=>{el.textContent=x.text}});el.textContent=r.text;
 }catch(e){el.textContent="Chưa tải được giải thích thêm lúc này. Bạn xem phần Vì sao ở trên nhé."}

function bnote(mi,t,dur,type,a,v,vib){const o=AX.createOscillator(),g=AX.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(mi-69)/12);if(vib){const l=AX.createOscillator(),lg=AX.createGain();l.frequency.value=5;lg.gain.value=5;l.connect(lg);lg.connect(o.detune);l.start(t);l.stop(t+dur+.2)}g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*.5,t+a);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(BG1.g);o.start(t);o.stop(t+dur+.05)}
function bgStep(){
 if(!BG1)return;const m=MT[bgT],sb=60/m.b;
 while(BG1.nt<AX.currentTime+.5){
  const d=m.d[BG1.i++%m.d.length],t=BG1.nt,dur=d*sb;
  if(BG1.beat<.001)bnote(m.bass[BG1.bar++%m.bass.length],t,m.bd*sb*.9,"sine",.05,.6);
  if(Math.random()>m.rest){BG1.deg=Math.max(0,Math.min(9,BG1.deg+[-2,-1,-1,0,1,1,2][Math.random()*7|0]));bnote(m.r+SC[BG1.deg%5]+12*(BG1.deg/5|0),t,dur*m.sus,m.w,m.a,.7,m.vib)}
  if(m.hi&&Math.random()<.5)bnote(m.r+12+SC[Math.random()*5|0],t+dur/2,sb*.6,"sine",.005,.25);
  BG1.beat+=d;if(BG1.beat>=m.bd)BG1.beat-=m.bd;BG1.nt+=dur;
 }
}
function bgmStop(quick){if(!BG1)return;clearInterval(bgTimer);const g=BG1.g;try{g.gain.cancelScheduledValues(AX.currentTime);g.gain.setValueAtTime(g.gain.value,AX.currentTime);g.gain.linearRampToValueAtTime(0,AX.currentTime+(quick?.4:.8))}catch(e){}setTimeout(()=>{try{g.disconnect()}catch(e){}},1000);BG1=null;bgT=""}
