SUP.logout=()=>{SUP.ses=null;SUP.prof=undefined;try{localStorage.removeItem("pl_sbp")}catch(e){};SUP.keep();CMX.lb=CMX.hl=null;try{localStorage.removeItem(SBQ)}catch(e){}};
/* hàng đợi gửi kết quả bài làm lên máy chủ (XP do máy chủ tự tính) */
const qld=()=>{try{return JSON.parse(localStorage.getItem(SBQ))||[]}catch(e){return[]}},qsv=q=>{try{localStorage.setItem(SBQ,JSON.stringify(q.slice(-100)))}catch(e){}};
SUP.enq=(k,lv,ls,pct)=>{if(!SUP.ses)return;const q=qld();q.push({k,lv,ls,p:Math.round(pct*100)/100});qsv(q);SUP.flush()};
SUP.flush=async()=>{if(SUP.fl||!SUP.ok())return;SUP.fl=1;let again=0;
 try{const q=qld();while(q.length){const it=q[0];try{const r=await SUP.rpc("submit_result",{p_kind:it.k,p_lv:it.lv,p_ls:it.ls,p_pct:it.p});q.shift();qsv(q);CMX.stale=1;if(r&&r.new_badges&&r.new_badges.length)toast("Bạn vừa nhận huy chương mới trên bảng vinh danh!")}
  catch(e){const m=e.message;if(m=="too_fast"){again=1;break}if(m=="net"||m=="auth"||m=="not_approved")break;SUP.drop=(SUP.drop||0)+1;SUP.lastErr=m;q.shift();qsv(q)}}}
 finally{SUP.fl=0}
 if(again)setTimeout(SUP.flush,9000);if(route().pg=="comm"&&CMX.stale){CMX.stale=0;commLoad(1)}};
const _aw3=award;award=function(...a){const o=_aw3(...a);if(o)SUP.enq(a[0],a[1],a[2],a[3]);return o};
setInterval(()=>{if(document.hidden)return;SUP.flush();if(route().pg=="comm"&&SUP.ok())commLoad(1)},20000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&route().pg=="comm"&&SUP.ok())commLoad(1)});
/* giao diện */
const escx=t=>String(t==null?"":t).replace(/[<>&"]/g,"");
const BD=[["xp","总经验排行榜","Xếp hạng tổng XP","r_xp",r=>r.xp+" XP","Tổng XP do máy chủ tính từ kết quả bài làm đã gửi (mỗi mốc chỉ cộng một lần). Bằng điểm: nhiều bài hoàn thành hơn → đạt XP sớm hơn → tên theo A–Z."],
["les","学习达人榜","Số bài hoàn thành","r_lessons",r=>r.lessons+" bài","Đếm số bài học đã làm đủ Luyện tập, Ghép đôi và Dịch câu. Bằng điểm: XP cao hơn → đạt sớm hơn."],
["str","勤奋之星榜","Chuỗi ngày học liên tiếp","r_streak",r=>r.cur_streak+" ngày","Số ngày học liên tiếp đang giữ (tính theo giờ Việt Nam, nghỉ một ngày là về 0). Bằng điểm: chuỗi dài nhất từng đạt → XP."],
["tst","高分学霸榜","Thành tích kiểm tra","r_test",r=>Math.round(r.test_score)+"/400","Tổng điểm cao nhất của 4 bài kiểm tra lớn (tối đa 400). Bằng điểm: làm nhiều bài kiểm tra hơn → XP cao hơn."],
["med","成就收藏榜","Số huy chương","r_medals",r=>r.medals+" huy chương","Đếm huy chương do máy chủ xác minh (nhóm học tập, kiên trì và kinh nghiệm). Bằng điểm: XP cao hơn → nhận huy chương sớm hơn."]];
const PZ=["金牌学霸","银牌学霸","铜牌学霸"];
const pnd=r=>`<span class="lbp">${pdr(r,"idle")}</span>`;
function cmShell(h){return`<h2 class="h2 hz">学习荣誉榜 <small style="font-size:14px;font-weight:500">Vinh danh học viên xuất sắc</small></h2>`+h}
/* ---- Tài khoản nằm trong Cài đặt ---- */
SUP.setP=p=>{SUP.prof=p||null;try{p?localStorage.setItem("pl_sbp",JSON.stringify(p)):localStorage.removeItem("pl_sbp")}catch(e){}};
function acctHTML(){const up=CMX.mode=="up",P=SUP.prof,err=`<div class="cmerr" role="alert">${escx(CMX.err)}</div>`;let h='<div class="acct"><h3>Tài khoản học viên</h3>';
 if(SUP.ses&&P){h+=`<div class="srow"><div><b>${escx(P.display_name)}</b><small>@${escx(P.username)} · ${P.approved||P.is_teacher?"Đã tham gia lớp":"Chờ giáo viên duyệt"}</small></div><div>${P.approved||P.is_teacher?"":'<button class="sw" onclick="SUP.setP(undefined);SUP.prof=undefined;acctRefresh()">Kiểm tra lại</button> '}<button class="sw" onclick="cmOut()">Đăng xuất</button></div></div><small class="qh">Thiết bị này đã ghi nhớ đăng nhập, lần sau bạn không cần đăng nhập lại.</small>`}
 else if(SUP.ses&&P===undefined)h+=CMX.chk?'<p class="qh">Đang kiểm tra tài khoản…</p>':`<p class="qh">Chưa kiểm tra được tài khoản.</p><div class="cmerr" role="alert">${escx(CMX.err)}</div><button class="pri" onclick="acctRefresh()">Thử lại</button> <button class="sw" onclick="cmOut()">Đăng xuất</button>`;
 else if(SUP.ses)h+=`<p class="qh">Bạn chưa tham gia lớp. Nhập tên hiển thị và mã lớp do giáo viên cung cấp.</p><input class="inp" id="cmd" placeholder="Tên hiển thị" maxlength="24"><input class="inp" id="cmc" placeholder="Mã lớp" autocapitalize="characters">${err}<button class="pri" onclick="cmJoin()">Tham gia lớp</button> <button class="sw" onclick="cmOut()">Đăng xuất</button>`;
 else h+=`<div class="seg"><button class="${up?"":"on"}" onclick="CMX.mode='in';CMX.err='';setRender()">Đăng nhập</button><button class="${up?"on":""}" onclick="CMX.mode='up';CMX.err='';setRender()">Tạo tài khoản</button></div>
<input class="inp" id="cmu" placeholder="Tên đăng nhập (a–z, 0–9, _)" maxlength="20" autocapitalize="none" autocomplete="username"><input class="inp" id="cmp" type="password" placeholder="Mật khẩu (từ 6 ký tự)" autocomplete="${up?"new-password":"current-password"}">
${up?`<input class="inp" id="cmd" placeholder="Tên hiển thị trên bảng xếp hạng" maxlength="24"><input class="inp" id="cmc" placeholder="Mã lớp do giáo viên cung cấp" autocapitalize="characters">`:""}
<small class="qh">Không cần email, chỉ cần tên đăng nhập và mật khẩu. Hãy nhớ mật khẩu của bạn.</small>${err}<button class="pri" onclick="cmAuth()" ${CMX.busy?"disabled":""}>${CMX.busy?"Đang xử lý…":up?"Tạo tài khoản":"Đăng nhập"}</button>`;
 return h+'</div>'}
const _sr=setRender;setRender=function(){_sr();const p=document.querySelector("#setp"),h=p&&p.querySelector(".sph");if(h)h.insertAdjacentHTML("afterend",acctHTML())};
function acctRefresh(){CMX.chk=1;CMX.err="";setRender();SUP.rpc("my_profile").then(pr=>{CMX.chk=0;SUP.setP(pr);setRender();commView();SUP.flush()}).catch(e=>{CMX.chk=0;CMX.err=SUP.errTxt(e.message);setRender()})}
async function cmAuth(){const u=$("#cmu").value.trim(),p=$("#cmp").value,up=CMX.mode=="up";CMX.err="";
 if(!okU(u)){CMX.err="Tên đăng nhập gồm 3–20 ký tự a–z, 0–9 hoặc _.";setRender();return}
 if(p.length<6){CMX.err="Mật khẩu cần tối thiểu 6 ký tự.";setRender();return}
 let dn="",code="";if(up){dn=$("#cmd").value.trim();code=$("#cmc").value.trim();if(!dn){CMX.err="Hãy nhập tên hiển thị.";setRender();return}}
 CMX.busy=1;setRender();
 try{if(up){const j=await SUP.fetch("/auth/v1/signup",{email:sbEm(u),password:p});if(!j||!j.access_token)throw new Error("confirm");SUP.set(j);SUP.setP(await SUP.rpc("join_class",{p_display:dn,p_code:code}))}
  else{SUP.set(await SUP.fetch("/auth/v1/token?grant_type=password",{email:sbEm(u),password:p}));SUP.setP(await SUP.rpc("my_profile"))}
  CMX.err="";toast("Đã đăng nhập, thiết bị sẽ ghi nhớ tài khoản của bạn");SUP.cos=0;SUP.flush()}catch(e){CMX.err=SUP.errTxt(e.message);if(up&&SUP.ses&&SUP.prof===undefined)SUP.prof=null}
 CMX.busy=0;setRender();commView()}
async function cmJoin(){try{SUP.setP(await SUP.rpc("join_class",{p_display:$("#cmd").value.trim(),p_code:$("#cmc").value.trim()}));CMX.err=""}catch(e){CMX.err=SUP.errTxt(e.message)}setRender();commView()}
function cmOut(){SUP.logout();SUP.setP(undefined);setRender();commView()}
function cmNeed(msg){return cmShell(`<div class="soon">${msg}<br><button class="pri" style="margin-top:12px" onclick="setOpen(1)">Mở Cài đặt tài khoản</button></div>`)}
function cmBoard(){const L=CMX.lb,H=CMX.hl||{},b=BD.find(x=>x[0]==CMX.tab)||BD[0],k=b[3],rows=[...L].sort((x,y)=>x[k]-y[k]),me=L.find(r=>r.is_me),top=rows.slice(0,3);
 const pod=[1,0,2].filter(i=>top[i]).map(i=>{const r=top[i];return`<div class="pd p${i+1}"><div class="pz hz">${PZ[i]}</div>${pnd(r)}<b>${escx(r.display_name)}</b><small>Cấp ${r.panda_lvl} · ${r.xp} XP</small>${CMX.tab!="xp"?`<small class="bv">${b[4](r)}</small>`:""}<div class="pb"><span>${i+1}</span></div></div>`}).join("");
 const row=r=>`<div class="lr ${r.is_me?"me":""}" onclick="cmVisit(${L.indexOf(r)})" style="cursor:pointer" ${r.is_me?'id="cmme"':""}><b class="rk">${r[k]}</b>${pnd(r)}<div class="nm"><b>${escx(r.display_name)}${r.is_me?" (bạn)":""}</b><small>Cấp ${r.panda_lvl}${CMX.tab!="xp"?" · "+b[4](r):""}</small></div><div class="nu"><b>${r.xp}</b><small>XP</small></div><div class="nu"><b>${r.lessons}</b><small>bài</small></div><div class="nu"><b>${r.medals}</b><small>HC</small></div></div>`;
 const hl=(t,s,a,e)=>`<div class="cd hc"><h3 class="hz">${t}</h3><small class="qh">${s}</small>${a&&a.length?`<ol>${a.map(e).join("")}</ol>`:'<p class="qh">Chưa có ai trong tuần này.</p>'}</div>`;
 const hist={};(H.history||[]).forEach(x=>{(hist[x.week_start]=hist[x.week_start]||[]).push(x)});
 return cmShell(`<div class="cmme"><div><b>${escx(SUP.prof.display_name)}</b><small> · hạng <b>#${me?me[k]:"–"}</b>/${L.length} (${b[1]})</small></div><div><button class="sw" onclick="document.querySelector('#cmme')&&document.querySelector('#cmme').scrollIntoView({block:'center',behavior:'smooth'})">Đến vị trí của tôi</button> <button class="sw" onclick="cmOut()">Đăng xuất</button></div></div>
<div class="acf">${BD.map(x=>`<button class="${CMX.tab==x[0]?"on":""}" onclick="CMX.tab='${x[0]}';commView()"><span class="hz">${x[1]}</span></button>`).join("")}</div>
<p class="qh" style="margin:0 0 8px"><b>${b[2]}</b></p><div class="podium">${pod}</div>
<details class="cd"><summary>Cách tính bảng này</summary><p class="qh">${b[5]} Dữ liệu lấy từ máy chủ, học viên không tự sửa được XP hay thứ hạng.</p></details>
<p class="qh" style="margin:0 0 6px">XP · số bài hoàn thành · HC (huy chương đã đạt)</p><div class="lb">${rows.map(row).join("")}</div>
<h3 class="hz" style="margin-top:22px">本周荣誉 · Vinh danh trong tuần</h3><p class="qh">Không chỉ người đứng đầu: ai tiến bộ hoặc chăm chỉ cũng được ghi nhận.</p>
<div class="hgrid">${hl("本周学习之星","Xuất sắc nhất tuần (nhiều XP nhất)",H.top,x=>`<li><b>${escx(x.name)}</b> <small>+${x.val} XP</small></li>`)}
${hl("本周进步之星","Ngôi sao tiến bộ của tuần: tiến bộ so với chính mình",H.progress,x=>`<li><b>${escx(x.name)}</b> <small>${x.kind=="score"?"điểm TB "+x.from+"% → "+x.to+"%":"XP tuần này tăng +"+x.val}</small></li>`)}
${hl("勤奋之星","Chăm chỉ nhất (số ngày học trong 7 ngày)",H.diligent,x=>`<li><b>${escx(x.name)}</b> <small>${x.days}/7 ngày · ${x.tries} lượt làm bài</small></li>`)}
${hl("新勋章","Vừa đạt huy chương mới",H.recent,x=>`<li><b>${escx(x.name)}</b> <small>${escx(x.zh)} · ${TN3[x.tier]||""}</small></li>`)}</div>
<details class="cd"><summary class="hz">名人堂 · Lịch sử Top 3 theo tuần</summary>${Object.keys(hist).length?Object.keys(hist).map(w=>`<p><b>Tuần ${new Date(w).toLocaleDateString("vi-VN")}</b><br>${hist[w].map(x=>PZ[x.rank-1].slice(0,2)+" "+escx(x.name)+" ("+x.xp+" XP)").join(" · ")}</p>`).join(""):'<p class="qh">Chưa có tuần nào kết thúc.</p>'}</details>
<p class="qh cen">Tự làm mới mỗi 20 giây${CMX.t?" · cập nhật "+new Date(CMX.t).toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"}):""} · <a href="#ach" style="color:var(--red);font-weight:700">Huy chương cá nhân</a></p>`)}
function commView(){const A=$("#app");if(route().pg!="comm")return;
 if(!SUP.ses){A.innerHTML=cmNeed("Hãy đăng nhập hoặc tạo tài khoản để xem bảng xếp hạng của cả lớp PingLaoshi.");if(!SUP.auto){SUP.auto=1;setOpen(1)}return}
 if(SUP.prof===undefined){A.innerHTML=cmShell('<div class="soon">Đang kiểm tra tài khoản…</div>');SUP.rpc("my_profile").then(p=>{SUP.setP(p);setRender();commView()}).catch(e=>{if(SUP.ses)A.innerHTML=cmShell(`<div class="soon">${escx(SUP.errTxt(e.message))}<br><button class="pri" style="margin-top:10px" onclick="commView()">Thử lại</button></div>`);else commView()});return}
 if(SUP.prof===null){A.innerHTML=cmNeed("Tài khoản của bạn chưa tham gia lớp. Hãy nhập mã lớp trong Cài đặt.");return}
 if(!SUP.ok()){A.innerHTML=cmNeed(`Tài khoản <b>${escx(SUP.prof.display_name)}</b> đang chờ giáo viên duyệt.<br>Khi được duyệt, bạn sẽ xuất hiện trên bảng xếp hạng.`);return}
 if(!CMX.lb){A.innerHTML=cmShell('<div class="soon">Đang tải bảng xếp hạng…</div>');commLoad();return}
 A.innerHTML=cmBoard()}
async function commLoad(quiet){try{SUP.flush();const [lb,hl]=await Promise.all([SUP.rpc("get_leaderboard"),SUP.rpc("get_highlights")]);CMX.lb=lb||[];CMX.hl=hl||{};CMX.t=Date.now();CMX.stale=0;CMX.err="";if(!SUP.cos){SUP.cos=1;cosSync()}
  if(route().pg=="comm"){const y=window.scrollY;commView();if(quiet)window.scrollTo(0,y)}}
 catch(e){if(quiet&&CMX.lb)return;if(route().pg=="comm")$("#app").innerHTML=cmShell(`<div class="soon">${escx(SUP.errTxt(e.message))}<br><button class="pri" style="margin-top:10px" onclick="CMX.lb=null;commView()">Thử lại</button></div>`)}}
PG.comm=()=>{CMX.lb=null;SUP.cos=0;if(SUP.ses&&SUP.prof&&SUP.prof.approved)SUP.flush();commView()};

if(SUP.ses&&!SUP.prof)acctRefresh();else if(SUP.ses)SUP.rpc("my_profile").then(pr=>{SUP.setP(pr);if(document.querySelector("#setov.on"))setRender();SUP.flush()}).catch(()=>{});

render();

</script>
